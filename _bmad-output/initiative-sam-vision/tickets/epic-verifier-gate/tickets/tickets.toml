[[entry]]
id = 1
type = "story"
title = "The minimum clean score is recorded per SAM spec"
description = "Writes the lowest score SAM gave each spec's object on the clean replay into the verifier's own verdict file for that spec, and reports a later clean run below the agreed floor instead of passing it quietly. Verifier-side, so the adapter stays epic-video-tracking's, and no approved spec is edited."
verify = "A clean replay's verdict-<spec>.json names the minimum score per SAM spec, and an offline test with a lowered score shows the drop reported rather than passed."
covers = ["R8"]
after = []
hitl = true
risk = "medium"


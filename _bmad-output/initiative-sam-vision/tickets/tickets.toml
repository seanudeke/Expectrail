slug = "epic-held-out-bench"
title = "Detection on the private held-out variants is measured"
description = "Every active private held-out variant, and the clean game as a false-alarm control, has a caught or not-caught result over the smoke route and every private route, published as ids, counts and verdicts only. This epic owns the SAM key and the sam-probe workflow's mode set, which the later epics reuse."

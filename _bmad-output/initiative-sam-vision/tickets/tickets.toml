slug = "epic-verifier-gate"
title = "The verdict with SAM on is one SAM saw on every frame"
description = "Candidate, clean and held-out replays are judged on SAM's observations with the ground line from the unpatched level, any SAM failure is needs-review, and each SAM spec carries its score margin recorded in the verdict; the docs say what the runs show. Its live end-to-end story runs through the sam-probe workflow and with the SAM key epic-held-out-bench established."
covers = ["R1", "R2", "R3", "R4", "R5", "R6", "R9", "R10"]

[[epic]]

# Run by hand: renders the clean game and every seeded bug, then asks SAM 3.1 (Meta Model API) what
# it sees on a sample of frames. Results land in the run summary, in annotations (readable through
# the checks API), in the sam-probe artifact, and on the sam-probe-results branch (probe.json,
# probe.md and contact sheets; per-frame overlays stay in the artifact). See docs/sam.md.
#
# Uses the MODEL_API_KEY repo secret, or META_API_KEY when that is the only one set. Never runs on
# pull requests, so the key is never exposed to forks. Probe mode never fetches the private held-out
# set; verify and heldout-bench modes do, and publish only verdicts (see those jobs).
name: SAM probe

on:
  workflow_dispatch:
    inputs:
      mode:
        description: probe (look at frames), verify (Gate 1 accept path with SAM on, incl. private held-out routes), heldout-bench (would the verifier catch each private bug variant) or dev-bench (the same for the public development variants) or video-compare (every frame of the clean game and each public bug sent to SAM both as images and as one video, to measure the cheaper video path)
        type: choice
        options: [probe, verify, heldout-bench, dev-bench, video-compare]
        default: probe
      every:
        description: Probe every Nth frame of each run (10 means 13 frames a run; heldout-bench ignores it and samples as the verifier does)
        default: '10'
      frames:
        description: Or an explicit comma-separated list of frame numbers (overrides every)
        default: ''
      spec:
        description: Test spec to probe with
        default: specs/player-stays-above-ground.json
      prompts:
        description: Probe with other prompts, e.g. ground=floor;player=robot (the spec file is not changed)
        default: ''
      sweep:
        description: Try several prompts for one object, e.g. ground=ground|floor|dirt (up to 9)
        default: ''
      runs:
        description: Only these runs, e.g. clean,physics-fall-through_v1 (default all); in heldout-bench mode, variant ids, e.g. clean,layering/v5; in dev-bench mode, e.g. dev/sinking/v2
        default: ''
      engine_ground:
        description: probe mode, take this object (e.g. ground) from the engine's ground line instead of SAM
        default: ''
      candidate:
        description: verify mode only, the candidate patch to verify
        default: agents/fixtures/fix-collision-mask.patch
      judge:
        description: heldout-bench / dev-bench only, sam (SAM 3.1) or glimmer-engine (Muse Glimmer checked against the engine, no SAM key passed; GLIMMER_MODEL repo variable)
        type: choice
        options: [sam, glimmer-engine]
        default: sam

permissions:
  contents: read

jobs:
  sam-probe:
    if: ${{ inputs.mode == 'probe' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SAM_KEY_SET: ${{ secrets.MODEL_API_KEY != '' || secrets.META_API_KEY != '' }}
    steps:
      - name: Require a Meta Model API key secret
        if: env.SAM_KEY_SET != 'true'
        run: |
          echo "::error::Set the MODEL_API_KEY (or META_API_KEY) repository secret first."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt pillow==12.3.0
      - name: Install a virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 patch
      - name: Download Godot 4.7.2 and check its SHA-512
        run: ./harness/get_godot.sh
      - name: Render the clean game and every seeded bug
        run: python -m harness.check_seeded --out runs/seeded
      - name: Ask SAM 3.1 what it sees
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY || secrets.META_API_KEY }}
          EVERY: ${{ inputs.every }}
          FRAMES: ${{ inputs.frames }}
          SPEC: ${{ inputs.spec }}
          PROMPTS: ${{ inputs.prompts }}
          SWEEP: ${{ inputs.sweep }}
          RUNS: ${{ inputs.runs }}
          ENGINE_GROUND: ${{ inputs.engine_ground }}
        run: |
          word="[A-Za-z0-9 -]+"
          name="[a-z][a-z0-9_-]*"
          [[ "$EVERY" =~ ^[0-9]+$ ]] || { echo "::error::every must be a number"; exit 1; }
          [[ -z "$FRAMES" || "$FRAMES" =~ ^[0-9]+(,[0-9]+)*$ ]] || { echo "::error::frames must be numbers and commas"; exit 1; }
          [[ "$SPEC" =~ ^specs/[A-Za-z0-9._-]+\.json$ && -f "$SPEC" ]] || { echo "::error::spec must be a file under specs/"; exit 1; }
          [[ -z "$PROMPTS" || "$PROMPTS" =~ ^$name=$word(\;$name=$word)*$ ]] || { echo "::error::prompts must look like ground=floor;player=robot"; exit 1; }
          [[ -z "$SWEEP" || "$SWEEP" =~ ^$name=$word(\|$word)*$ ]] || { echo "::error::sweep must look like ground=ground|floor|dirt"; exit 1; }
          [[ -z "$RUNS" || "$RUNS" =~ ^[A-Za-z0-9_.-]+(,[A-Za-z0-9_.-]+)*$ ]] || { echo "::error::runs must be run names and commas"; exit 1; }
          args=(--spec "$SPEC" --every "$EVERY" --out runs/sam-probe --runs)
          if [[ -n "$RUNS" ]]; then
            IFS=',' read -ra wanted <<< "$RUNS"
            for r in "${wanted[@]}"; do
              [[ -d "runs/seeded/$r/frames" ]] || { echo "::error::no run named $r"; exit 1; }
              args+=("runs/seeded/$r/")
            done
          else
            args+=(runs/seeded/*/)
          fi
          [[ -n "$FRAMES" ]] && args+=(--frames "$FRAMES")
          if [[ -n "$PROMPTS" ]]; then
            IFS=';' read -ra pairs <<< "$PROMPTS"
            for pair in "${pairs[@]}"; do args+=(--set "$pair"); done
          fi
          [[ -n "$SWEEP" ]] && args+=(--sweep "$SWEEP")
          if [[ -n "$ENGINE_GROUND" ]]; then
            [[ "$ENGINE_GROUND" =~ ^$name$ ]] || { echo "::error::engine_ground must be an object name"; exit 1; }
            args+=(--engine-ground "$ENGINE_GROUND")
          fi
          python -m agents.sam_probe "${args[@]}"
      - name: Show the probe in the run summary
        if: always()
        run: |
          if [ -f runs/sam-probe/probe.md ]; then cat runs/sam-probe/probe.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Keep the probe
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sam-probe
          path: runs/sam-probe/
          retention-days: 14

  # Public runs only (the smoke route): a video of a held-out route would be the route itself.
  sam-video:
    if: ${{ inputs.mode == 'video-compare' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SAM_KEY_SET: ${{ secrets.MODEL_API_KEY != '' || secrets.META_API_KEY != '' }}
    steps:
      - name: Require a Meta Model API key secret
        if: env.SAM_KEY_SET != 'true'
        run: |
          echo "::error::Set the MODEL_API_KEY (or META_API_KEY) repository secret first."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install a virtual display, software OpenGL and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 patch ffmpeg
      - name: Download Godot 4.7.2 and check its SHA-512
        run: ./harness/get_godot.sh
      - name: Render the clean game and every seeded bug (public route)
        run: python -m harness.check_seeded --out runs/seeded
      - name: Send every frame both ways
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY || secrets.META_API_KEY }}
          RUNS: ${{ inputs.runs }}
        run: |
          [[ -z "$RUNS" || "$RUNS" =~ ^[A-Za-z0-9_.-]+(,[A-Za-z0-9_.-]+)*$ ]] || { echo "::error::runs must be run names and commas"; exit 1; }
          dirs=()
          if [[ -n "$RUNS" ]]; then
            IFS=',' read -ra wanted <<< "$RUNS"
            for r in "${wanted[@]}"; do
              [[ -d "runs/seeded/$r/frames" ]] || { echo "::error::no run named $r"; exit 1; }
              dirs+=("runs/seeded/$r/")
            done
          else
            dirs=(runs/seeded/*/)
          fi
          python -m agents.sam_video --spec specs/player-always-visible.json --spec specs/coins-visible.json \
            --out runs/sam-probe "${dirs[@]}"
      - name: Show the comparison in the run summary
        if: always()
        run: |
          if [ -f runs/sam-probe/video.md ]; then cat runs/sam-probe/video.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Keep the comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sam-probe
          path: runs/sam-probe/
          retention-days: 14

  # A separate job pushes the results: it gets write access but no API key, and runs no
  # third-party Python. The probe job keeps read-only access.
  publish:
    needs: [sam-probe, sam-video]
    if: ${{ always() && (needs.sam-probe.result != 'skipped' || needs.sam-video.result != 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sam-probe
          path: probe
      - name: Add probe.json, probe.md and the contact sheets to sam-probe-results/<run id>
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          find probe -type f -name 'f0*.png' -delete
          printf '%s\n' "$INPUTS" > probe/inputs.json
          printf 'run %s on %s\n' "$RUN_ID" "$REF" > probe/RUN.txt
          url="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git init -q results && cd results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Each run gets its own folder; concurrent runs retry on top of each other.
          for attempt in 1 2 3 4 5; do
            if git fetch -q --depth 1 "$url" sam-probe-results 2>/dev/null; then
              git checkout -q -B sam-probe-results FETCH_HEAD
            else
              git checkout -q --orphan sam-probe-results
            fi
            rm -rf "$RUN_ID" && cp -r ../probe "$RUN_ID"
            git add -A "$RUN_ID" && git commit -q -m "SAM probe run $RUN_ID on $REF"
            if git push -q "$url" HEAD:sam-probe-results; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1

  # mode=verify: the real Gate 1 accept path (seeded fall-through + the known-good fix) with SAM on,
  # including the private held-out routes. Check results leave the runner as annotations, and the
  # review leaves as the sam-review artifact: its record, the public route's two frames and its page,
  # uploaded only after the export scan (with the private set) finds nothing. The private routes
  # appear in the record as counts only; their frames, names and verdict file never leave.
  sam-verify:
    if: ${{ inputs.mode == 'verify' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SAM_KEY_SET: ${{ secrets.MODEL_API_KEY != '' || secrets.META_API_KEY != '' }}
      HELDOUT_TOKEN_SET: ${{ secrets.HELDOUT_TOKEN != '' }}
    steps:
      - name: Require a Meta Model API key secret
        if: env.SAM_KEY_SET != 'true'
        run: |
          echo "::error::Set the MODEL_API_KEY (or META_API_KEY) repository secret first."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install a virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 patch
      - name: Download Godot 4.7.2 and check its SHA-512
        run: ./harness/get_godot.sh
      - name: Fetch the private held-out set (verifier side only)
        if: env.HELDOUT_TOKEN_SET == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: seanudeke/Expectrail-heldout
          token: ${{ secrets.HELDOUT_TOKEN }}
          path: heldout-set
          persist-credentials: false
      - name: Point the verifier at the held-out set
        if: env.HELDOUT_TOKEN_SET == 'true'
        # A probe reports every private route, even for a candidate that already failed.
        run: |
          echo "EXPECTRAIL_HELDOUT_DIR=$GITHUB_WORKSPACE/heldout-set" >> "$GITHUB_ENV"
          echo "EXPECTRAIL_HELDOUT_AFTER_FAIL=run" >> "$GITHUB_ENV"
      - name: Gate 1 accept path with SAM on
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY || secrets.META_API_KEY }}
          EXPECTRAIL_OBS_PROVIDER: sam
          EVERY: ${{ inputs.every }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          [[ "$EVERY" =~ ^[0-9]+$ ]] || { echo "::error::every must be a number"; exit 1; }
          [[ "$CANDIDATE" =~ ^agents/fixtures/[A-Za-z0-9._-]+\.patch$ && -f "$CANDIDATE" ]] || { echo "::error::candidate must be a patch under agents/fixtures/"; exit 1; }
          export EXPECTRAIL_SAM_EVERY="$EVERY"
          set +e
          python -m agents.gate1 --out runs/sam-verify --candidate-patch "$CANDIDATE"
          echo "gate1 exit $?"
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path("runs/sam-verify/verify")
          doc = json.loads((out / "verification.json").read_text())
          rows = ", ".join(f"{c['kind']} {c['spec']} {c['result']}" for c in doc["checks"])
          sources = {k: v.get("source") for k, v in (doc.get("suite") or {}).items() if isinstance(v, dict)}
          print(f"::notice title=SAM verify decision::{doc['decision']}; sources {sources}")
          print(f"::notice title=SAM verify checks::{rows}")
          held = out / "verdict-held-out.json"
          if held.is_file():
              routes = json.loads(held.read_text()).get("routes", [])
              per_spec = {}
              for r in routes:
                  for spec, result in (r.get("visuals") or {}).items():
                      per_spec.setdefault(spec, []).append(result)
              summary = "; ".join(f"{s}: {v.count('pass')}/{len(v)} routes pass" for s, v in per_spec.items())
              gameplay = sum(r.get("gameplay") == "pass" for r in routes)
              print(f"::notice title=SAM verify held-out::{summary}; gameplay {gameplay}/{len(routes)} routes pass")
          for name in sorted(p.name for p in out.glob("observations-*-error.txt")):
              print(f"::warning title=SAM verify error::{name}: {(out / name).read_text().strip()[:300]}")
          PY
      - name: Review against the failing base with SAM on (reuses the verification above)
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY || secrets.META_API_KEY }}
          EXPECTRAIL_OBS_PROVIDER: sam
          EVERY: ${{ inputs.every }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          export EXPECTRAIL_SAM_EVERY="$EVERY"
          code=0
          python -m agents.review_change --request runs/sam-verify/repair-request.json --candidate "$CANDIDATE" \
            --verification runs/sam-verify/verify/verification.json --out runs/sam-review || code=$?
          python - "$code" <<'PY'
          import json, sys
          rec = json.load(open("runs/sam-review/change-evidence.json"))
          rows = "; ".join(f"{r['spec']} {r['before']} to {r['after']} {r['comparison']}" for r in rec["rows"])
          print(f"::notice title=SAM review::{rec['status']} (exit {sys.argv[1]}); {rec['evidenceLabel']}; "
                f"candidate from {rec['candidate']['origin']}; private checks {rec['private']['checks']}")
          print(f"::notice title=SAM review rows::{rows}")
          for reason in rec["reasons"][:3]:
              print(f"::notice title=SAM review reason::{' '.join(reason.split())[:300]}")
          PY
      - name: Gather the review (record, the two public-route frames, the page)
        if: always() && hashFiles('runs/sam-review/change-evidence.json') != ''
        run: |
          mkdir -p keep/sam-review/assets
          cp runs/sam-review/change-evidence.json keep/sam-review/
          if compgen -G 'runs/sam-review/assets/*.png' > /dev/null; then cp runs/sam-review/assets/*.png keep/sam-review/assets/; fi
          python -m agents.review_html keep/sam-review/change-evidence.json \
            || echo "::warning title=SAM review page::the page did not render; the record and frames are kept"
      - name: Scan the review before it leaves the runner
        id: export-scan
        if: always() && hashFiles('keep/sam-review/change-evidence.json') != ''
        run: python -m agents.export_scan keep/sam-review --private heldout-set --paths error
      - name: Keep the review
        if: always() && steps.export-scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sam-review
          path: keep/sam-review/
          retention-days: 14

  # mode=heldout-bench: for each private bug variant (and the clean game as a false-alarm control),
  # render the game with the variant and no fix on the smoke route and every private route, and
  # judge it with the verifier's checks (agents/heldout_bench.py). The private set's descriptions,
  # patches, frames and traces never leave the runner: no artifacts, the harness output goes to a
  # file that is never printed, and the only output is one annotation per variant with its id,
  # counts and verdicts. mode=dev-bench runs the public development variants (ids dev/<family>/vN)
  # through the same jobs, routes and checks, so both sets are measured the same way.
  heldout-list:
    if: ${{ inputs.mode == 'heldout-bench' || inputs.mode == 'dev-bench' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HELDOUT_TOKEN_SET: ${{ secrets.HELDOUT_TOKEN != '' }}
    outputs:
      variants: ${{ steps.list.outputs.variants }}
    steps:
      - name: Require the held-out token
        if: env.HELDOUT_TOKEN_SET != 'true'
        run: |
          echo "::error::Set the HELDOUT_TOKEN repository secret so the benchmark can read the private held-out set."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: seanudeke/Expectrail-heldout
          token: ${{ secrets.HELDOUT_TOKEN }}
          path: heldout-set
          persist-credentials: false
      - name: List the active variants (ids only)
        id: list
        env:
          EXPECTRAIL_HELDOUT_DIR: ${{ github.workspace }}/heldout-set
          RUNS: ${{ inputs.runs }}
          SET: ${{ inputs.mode == 'dev-bench' && 'dev' || 'held-out' }}
        run: |
          [[ -z "$RUNS" || "$RUNS" =~ ^[a-z0-9/_-]+(,[a-z0-9/_-]+)*$ ]] || { echo "::error::runs must be variant ids and commas"; exit 1; }
          variants=$(python -m agents.heldout_bench --list --set "$SET" --only "$RUNS")
          [[ "$variants" =~ ^\[(\"[a-z0-9/_-]+\"(,\ )?)+\]$ ]] || { echo "::error::unexpected variant list"; exit 1; }
          echo "variants=$variants" >> "$GITHUB_OUTPUT"
          echo "variants: $variants"

  heldout-bench:
    needs: heldout-list
    runs-on: ubuntu-24.04
    # Glimmer on one shared replica answers about one frame a second across the parallel jobs.
    timeout-minutes: ${{ inputs.judge == 'glimmer-engine' && 180 || 90 }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        variant: ${{ fromJSON(needs.heldout-list.outputs.variants) }}
    env:
      SAM_KEY_SET: ${{ secrets.MODEL_API_KEY != '' || secrets.META_API_KEY != '' }}
      FIREWORKS_KEY_SET: ${{ secrets.FIREWORKS_API_KEY != '' }}
      JUDGE: ${{ inputs.judge }}
      GLIMMER_MODEL: ${{ vars.GLIMMER_MODEL }}
    steps:
      - name: Require the judge's key secret
        run: |
          if [ "$JUDGE" = "glimmer-engine" ]; then
            [ "$FIREWORKS_KEY_SET" = "true" ] || { echo "::error::Set the FIREWORKS_API_KEY repository secret first."; exit 1; }
            [[ "$GLIMMER_MODEL" =~ ^accounts/[A-Za-z0-9_-]+/deployments/[A-Za-z0-9_-]+$ ]] || { echo "::error::Set the GLIMMER_MODEL repo variable to accounts/<account>/deployments/<id>."; exit 1; }
          elif [ "$SAM_KEY_SET" != "true" ]; then
            echo "::error::Set the MODEL_API_KEY (or META_API_KEY) repository secret first."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install a virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 patch
      - name: Download Godot 4.7.2 and check its SHA-512
        run: ./harness/get_godot.sh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: seanudeke/Expectrail-heldout
          token: ${{ secrets.HELDOUT_TOKEN }}
          path: heldout-set
          persist-credentials: false
      - name: Glimmer - restore the deployment's scaling if needed, and wake it
        if: inputs.judge == 'glimmer-engine'
        env:
          EXPECTRAIL_GLIMMER_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          EXPECTRAIL_GLIMMER_MODEL: ${{ vars.GLIMMER_MODEL }}
        run: |
          python -m agents.fireworks_deployment --restore --model "$EXPECTRAIL_GLIMMER_MODEL"
          python -m agents.glimmer_client --warm --timeout 900
      - name: Render and judge the variant (output kept on the runner)
        env:
          MODEL_API_KEY: ${{ inputs.judge != 'glimmer-engine' && (secrets.MODEL_API_KEY || secrets.META_API_KEY) || '' }}
          EXPECTRAIL_GLIMMER_API_KEY: ${{ inputs.judge == 'glimmer-engine' && secrets.FIREWORKS_API_KEY || '' }}
          EXPECTRAIL_GLIMMER_MODEL: ${{ vars.GLIMMER_MODEL }}
          EXPECTRAIL_VISION_BACKEND: ${{ inputs.judge == 'glimmer-engine' && 'glimmer-engine' || 'sam' }}
          EXPECTRAIL_OBS_PROVIDER: sam
          EXPECTRAIL_HELDOUT_DIR: ${{ github.workspace }}/heldout-set
          VARIANT: ${{ matrix.variant }}
        run: |
          [[ "$VARIANT" =~ ^[a-z0-9_-]+(/[a-z0-9_-]+){0,2}$ ]] || { echo "::error::unexpected variant id"; exit 1; }
          start=$(date +%s)
          # The benchmark exits non-zero when it decided nothing, so the counts are still published
          # and the job is red: a green run always means the checks ran.
          set +e
          python -m agents.heldout_bench --variant "$VARIANT" --out runs/bench > bench.log 2>&1
          code=$?
          set -e
          bench_json="runs/bench/${VARIANT//\//_}/bench.json"
          [[ -f "$bench_json" ]] && python -m agents.heldout_bench --annotate "$bench_json"
          echo "::notice title=Bench time ${VARIANT}::$(( $(date +%s) - start )) s"
          if [[ "$code" -ne 0 ]]; then
            echo "::error title=Held-out bench ${VARIANT}::the benchmark decided nothing or failed (exit $code); its log stays on the runner"
            exit "$code"
          fi

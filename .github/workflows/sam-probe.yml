# Run by hand: renders the clean game and every seeded bug, then asks SAM 3.1 (Meta Model API) what
# it sees on a sample of frames. Results land in the run summary, in annotations (readable through
# the checks API), in the sam-probe artifact, and on the sam-probe-results branch (probe.json,
# probe.md and contact sheets; per-frame overlays stay in the artifact). See docs/sam.md.
#
# Uses the MODEL_API_KEY repo secret, or META_API_KEY when that is the only one set. Never runs on
# pull requests, so the key is never exposed to forks. The private held-out set is not fetched here.
name: SAM probe

on:
  workflow_dispatch:
    inputs:
      mode:
        description: probe (look at frames) or verify (Gate 1 accept path with SAM on, incl. private held-out routes)
        type: choice
        options: [probe, verify]
        default: probe
      every:
        description: Probe every Nth frame of each run (10 means 13 frames a run)
        default: '10'
      frames:
        description: Or an explicit comma-separated list of frame numbers (overrides every)
        default: ''
      spec:
        description: Test spec to probe with
        default: specs/player-stays-above-ground.json
      prompts:
        description: Probe with other prompts, e.g. ground=floor;player=robot (the spec file is not changed)
        default: ''
      sweep:
        description: Try several prompts for one object, e.g. ground=ground|floor|dirt (up to 9)
        default: ''
      runs:
        description: Only these runs, e.g. clean,physics-fall-through_v1 (default all)
        default: ''
      candidate:
        description: verify mode only, the candidate patch to verify
        default: agents/fixtures/fix-collision-mask.patch

permissions:
  contents: read

jobs:
  sam-probe:
    if: ${{ inputs.mode != 'verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SAM_KEY_SET: ${{ secrets.MODEL_API_KEY != '' || secrets.META_API_KEY != '' }}
    steps:
      - name: Require a Meta Model API key secret
        if: env.SAM_KEY_SET != 'true'
        run: |
          echo "::error::Set the MODEL_API_KEY (or META_API_KEY) repository secret first."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt pillow==12.3.0
      - name: Install a virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 patch
      - name: Download Godot 4.7.2 and check its SHA-512
        run: ./harness/get_godot.sh
      - name: Render the clean game and every seeded bug
        run: python -m harness.check_seeded --out runs/seeded
      - name: Ask SAM 3.1 what it sees
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY || secrets.META_API_KEY }}
          EVERY: ${{ inputs.every }}
          FRAMES: ${{ inputs.frames }}
          SPEC: ${{ inputs.spec }}
          PROMPTS: ${{ inputs.prompts }}
          SWEEP: ${{ inputs.sweep }}
          RUNS: ${{ inputs.runs }}
        run: |
          word="[A-Za-z0-9 -]+"
          name="[a-z][a-z0-9_-]*"
          [[ "$EVERY" =~ ^[0-9]+$ ]] || { echo "::error::every must be a number"; exit 1; }
          [[ -z "$FRAMES" || "$FRAMES" =~ ^[0-9]+(,[0-9]+)*$ ]] || { echo "::error::frames must be numbers and commas"; exit 1; }
          [[ "$SPEC" =~ ^specs/[A-Za-z0-9._-]+\.json$ && -f "$SPEC" ]] || { echo "::error::spec must be a file under specs/"; exit 1; }
          [[ -z "$PROMPTS" || "$PROMPTS" =~ ^$name=$word(\;$name=$word)*$ ]] || { echo "::error::prompts must look like ground=floor;player=robot"; exit 1; }
          [[ -z "$SWEEP" || "$SWEEP" =~ ^$name=$word(\|$word)*$ ]] || { echo "::error::sweep must look like ground=ground|floor|dirt"; exit 1; }
          [[ -z "$RUNS" || "$RUNS" =~ ^[A-Za-z0-9_.-]+(,[A-Za-z0-9_.-]+)*$ ]] || { echo "::error::runs must be run names and commas"; exit 1; }
          args=(--spec "$SPEC" --every "$EVERY" --out runs/sam-probe --runs)
          if [[ -n "$RUNS" ]]; then
            IFS=',' read -ra wanted <<< "$RUNS"
            for r in "${wanted[@]}"; do
              [[ -d "runs/seeded/$r/frames" ]] || { echo "::error::no run named $r"; exit 1; }
              args+=("runs/seeded/$r/")
            done
          else
            args+=(runs/seeded/*/)
          fi
          [[ -n "$FRAMES" ]] && args+=(--frames "$FRAMES")
          if [[ -n "$PROMPTS" ]]; then
            IFS=';' read -ra pairs <<< "$PROMPTS"
            for pair in "${pairs[@]}"; do args+=(--set "$pair"); done
          fi
          [[ -n "$SWEEP" ]] && args+=(--sweep "$SWEEP")
          python -m agents.sam_probe "${args[@]}"
      - name: Show the probe in the run summary
        if: always()
        run: |
          if [ -f runs/sam-probe/probe.md ]; then cat runs/sam-probe/probe.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Keep the probe
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sam-probe
          path: runs/sam-probe/
          retention-days: 14

  # A separate job pushes the results: it gets write access but no API key, and runs no
  # third-party Python. The probe job keeps read-only access.
  publish:
    needs: sam-probe
    if: ${{ always() && needs.sam-probe.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sam-probe
          path: probe
      - name: Add probe.json, probe.md and the contact sheets to sam-probe-results/<run id>
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          find probe -type f -name 'f0*.png' -delete
          printf '%s\n' "$INPUTS" > probe/inputs.json
          printf 'run %s on %s\n' "$RUN_ID" "$REF" > probe/RUN.txt
          url="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git init -q results && cd results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Each run gets its own folder; concurrent runs retry on top of each other.
          for attempt in 1 2 3 4 5; do
            if git fetch -q --depth 1 "$url" sam-probe-results 2>/dev/null; then
              git checkout -q -B sam-probe-results FETCH_HEAD
            else
              git checkout -q --orphan sam-probe-results
            fi
            rm -rf "$RUN_ID" && cp -r ../probe "$RUN_ID"
            git add -A "$RUN_ID" && git commit -q -m "SAM probe run $RUN_ID on $REF"
            if git push -q "$url" HEAD:sam-probe-results; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1

  # mode=verify: the real Gate 1 accept path (seeded fall-through + the known-good fix) with SAM on,
  # including the private held-out routes. Only check results leave the runner, as annotations:
  # no frames, no artifacts, no route names, so nothing from the held-out set is published.
  sam-verify:
    if: ${{ inputs.mode == 'verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SAM_KEY_SET: ${{ secrets.MODEL_API_KEY != '' || secrets.META_API_KEY != '' }}
      HELDOUT_TOKEN_SET: ${{ secrets.HELDOUT_TOKEN != '' }}
    steps:
      - name: Require a Meta Model API key secret
        if: env.SAM_KEY_SET != 'true'
        run: |
          echo "::error::Set the MODEL_API_KEY (or META_API_KEY) repository secret first."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install a virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 patch
      - name: Download Godot 4.7.2 and check its SHA-512
        run: ./harness/get_godot.sh
      - name: Fetch the private held-out set (verifier side only)
        if: env.HELDOUT_TOKEN_SET == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: seanudeke/Nightshift-heldout
          token: ${{ secrets.HELDOUT_TOKEN }}
          path: heldout-set
          persist-credentials: false
      - name: Point the verifier at the held-out set
        if: env.HELDOUT_TOKEN_SET == 'true'
        run: echo "NIGHTSHIFT_HELDOUT_DIR=$GITHUB_WORKSPACE/heldout-set" >> "$GITHUB_ENV"
      - name: Gate 1 accept path with SAM on
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY || secrets.META_API_KEY }}
          NIGHTSHIFT_OBS_PROVIDER: sam
          EVERY: ${{ inputs.every }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          [[ "$EVERY" =~ ^[0-9]+$ ]] || { echo "::error::every must be a number"; exit 1; }
          [[ "$CANDIDATE" =~ ^agents/fixtures/[A-Za-z0-9._-]+\.patch$ && -f "$CANDIDATE" ]] || { echo "::error::candidate must be a patch under agents/fixtures/"; exit 1; }
          export NIGHTSHIFT_SAM_EVERY="$EVERY"
          set +e
          python -m agents.gate1 --out runs/sam-verify --candidate-patch "$CANDIDATE"
          echo "gate1 exit $?"
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path("runs/sam-verify/verify")
          doc = json.loads((out / "verification.json").read_text())
          rows = ", ".join(f"{c['kind']} {c['spec']} {c['result']}" for c in doc["checks"])
          sources = {k: v.get("source") for k, v in (doc.get("suite") or {}).items() if isinstance(v, dict)}
          print(f"::notice title=SAM verify decision::{doc['decision']}; sources {sources}")
          print(f"::notice title=SAM verify checks::{rows}")
          held = out / "verdict-held-out.json"
          if held.is_file():
              routes = json.loads(held.read_text()).get("routes", [])
              per_spec = {}
              for r in routes:
                  for spec, result in (r.get("visuals") or {}).items():
                      per_spec.setdefault(spec, []).append(result)
              summary = "; ".join(f"{s}: {v.count('pass')}/{len(v)} routes pass" for s, v in per_spec.items())
              gameplay = sum(r.get("gameplay") == "pass" for r in routes)
              print(f"::notice title=SAM verify held-out::{summary}; gameplay {gameplay}/{len(routes)} routes pass")
          for name in sorted(p.name for p in out.glob("observations-*-error.txt")):
              print(f"::warning title=SAM verify error::{name}: {(out / name).read_text().strip()[:300]}")
          PY

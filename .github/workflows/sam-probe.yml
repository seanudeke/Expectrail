# Run by hand: renders the clean game and every seeded bug, then asks SAM 3.1 (Meta Model API) what
# it sees on a sample of frames. Results land in the run summary, in annotations (readable through
# the checks API), in the sam-probe artifact, and on the sam-probe-results branch (probe.json,
# probe.md and contact sheets; per-frame overlays stay in the artifact). See docs/sam.md.
#
# Uses the MODEL_API_KEY repo secret, or META_API_KEY when that is the only one set. Never runs on
# pull requests, so the key is never exposed to forks. The private held-out set is not fetched here.
name: SAM probe

on:
  workflow_dispatch:
    inputs:
      every:
        description: Probe every Nth frame of each run (10 means 13 frames a run)
        default: '10'
      frames:
        description: Or an explicit comma-separated list of frame numbers (overrides every)
        default: ''
      spec:
        description: Test spec to probe with
        default: specs/player-stays-above-ground.json
      prompts:
        description: Probe with other prompts, e.g. ground=floor;player=robot (the spec file is not changed)
        default: ''
      sweep:
        description: Try several prompts for one object, e.g. ground=ground|floor|dirt (up to 9)
        default: ''
      runs:
        description: Only these runs, e.g. clean,physics-fall-through_v1 (default all)
        default: ''

permissions:
  contents: read

jobs:
  sam-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SAM_KEY_SET: ${{ secrets.MODEL_API_KEY != '' || secrets.META_API_KEY != '' }}
    steps:
      - name: Require a Meta Model API key secret
        if: env.SAM_KEY_SET != 'true'
        run: |
          echo "::error::Set the MODEL_API_KEY (or META_API_KEY) repository secret first."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt pillow==12.3.0
      - name: Install a virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 patch
      - name: Download Godot 4.7.2 and check its SHA-512
        run: ./harness/get_godot.sh
      - name: Render the clean game and every seeded bug
        run: python -m harness.check_seeded --out runs/seeded
      - name: Ask SAM 3.1 what it sees
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY || secrets.META_API_KEY }}
          EVERY: ${{ inputs.every }}
          FRAMES: ${{ inputs.frames }}
          SPEC: ${{ inputs.spec }}
          PROMPTS: ${{ inputs.prompts }}
          SWEEP: ${{ inputs.sweep }}
          RUNS: ${{ inputs.runs }}
        run: |
          word="[A-Za-z0-9 -]+"
          name="[a-z][a-z0-9_-]*"
          [[ "$EVERY" =~ ^[0-9]+$ ]] || { echo "::error::every must be a number"; exit 1; }
          [[ -z "$FRAMES" || "$FRAMES" =~ ^[0-9]+(,[0-9]+)*$ ]] || { echo "::error::frames must be numbers and commas"; exit 1; }
          [[ "$SPEC" =~ ^specs/[A-Za-z0-9._-]+\.json$ && -f "$SPEC" ]] || { echo "::error::spec must be a file under specs/"; exit 1; }
          [[ -z "$PROMPTS" || "$PROMPTS" =~ ^$name=$word(\;$name=$word)*$ ]] || { echo "::error::prompts must look like ground=floor;player=robot"; exit 1; }
          [[ -z "$SWEEP" || "$SWEEP" =~ ^$name=$word(\|$word)*$ ]] || { echo "::error::sweep must look like ground=ground|floor|dirt"; exit 1; }
          [[ -z "$RUNS" || "$RUNS" =~ ^[A-Za-z0-9_.-]+(,[A-Za-z0-9_.-]+)*$ ]] || { echo "::error::runs must be run names and commas"; exit 1; }
          args=(--spec "$SPEC" --every "$EVERY" --out runs/sam-probe --runs)
          if [[ -n "$RUNS" ]]; then
            IFS=',' read -ra wanted <<< "$RUNS"
            for r in "${wanted[@]}"; do
              [[ -d "runs/seeded/$r/frames" ]] || { echo "::error::no run named $r"; exit 1; }
              args+=("runs/seeded/$r/")
            done
          else
            args+=(runs/seeded/*/)
          fi
          [[ -n "$FRAMES" ]] && args+=(--frames "$FRAMES")
          if [[ -n "$PROMPTS" ]]; then
            IFS=';' read -ra pairs <<< "$PROMPTS"
            for pair in "${pairs[@]}"; do args+=(--set "$pair"); done
          fi
          [[ -n "$SWEEP" ]] && args+=(--sweep "$SWEEP")
          python -m agents.sam_probe "${args[@]}"
      - name: Show the probe in the run summary
        if: always()
        run: |
          if [ -f runs/sam-probe/probe.md ]; then cat runs/sam-probe/probe.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Keep the probe
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sam-probe
          path: runs/sam-probe/
          retention-days: 14

  # A separate job pushes the results: it gets write access but no API key, and runs no
  # third-party Python. The probe job keeps read-only access.
  publish:
    needs: sam-probe
    if: ${{ always() && needs.sam-probe.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sam-probe
          path: probe
      - name: Push probe.json, probe.md and the contact sheets to sam-probe-results
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          cd probe
          find . -type f -name 'f0*.png' -delete
          printf '%s\n' "$INPUTS" > inputs.json
          printf 'run %s on %s\n' "$RUN_ID" "$REF" > RUN.txt
          git init -q -b sam-probe-results
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "SAM probe run $RUN_ID on $REF"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" sam-probe-results

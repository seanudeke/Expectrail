# Tests for the contracts and the evaluator, and a capture smoke test that renders the game on a
# GPU-less runner exactly the way the overnight pipeline will.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily offline E2E film (UTC morning) — no Meta spend.
    - cron: '0 7 * * *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -t . -v

  capture-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install a virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0
      - name: Download Godot 4.7.2 and check its SHA-512
        run: ./harness/get_godot.sh
      - name: Render the smoke route twice and compare
        run: python -m harness.replay_check --route harness/routes/smoke.json --runs 2 --out runs/ci
      - name: Keep the frames of the first run
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-frames
          path: |
            runs/ci/run-00/frames/
            runs/ci/run-00/replay.json
            runs/ci/run-00/trace.json
            runs/ci/summary.json
          retention-days: 7

  # Every seeded bug must change what the player sees; an invisible variant is a benchmark case
  # nothing could ever catch.
  seeded-bugs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install a virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 patch
      - name: Download Godot 4.7.2 and check its SHA-512
        run: ./harness/get_godot.sh
      - name: Replay every seeded bug against the clean game
        run: python -m harness.check_seeded --out runs/seeded-check
      - name: The ground line is logged, and the position log sees a robot resting too low
        run: |
          python -m pip install -r requirements-dev.txt
          python - <<'PY'
          import json
          from pathlib import Path
          from agents.observations import from_trace_synthetic
          from nightshift.contracts import load
          from nightshift.evaluator import evaluate
          spec = load("agents/specs/player-stays-above-ground.json", "test-spec")
          root = Path("runs/seeded-check")
          clean = json.loads((root / "clean" / "trace.json").read_text())
          rows = [r for r in clean["rows"] if r.get("player")]
          assert rows and all("ground" in r and "view" in r for r in rows), "harness did not log ground and view"
          results = {name: evaluate(spec, from_trace_synthetic(json.loads((root / name / "trace.json").read_text())))["result"]
                     for name in ("clean", "sinking_v1", "sinking_v2")}
          print(results)
          # sinking v2 moves only the drawing, so the position log cannot see it; the SAM hybrid does.
          assert results == {"clean": "pass", "sinking_v1": "fail", "sinking_v2": "pass"}, results
          PY
      - name: Keep the summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seeded-check
          path: runs/seeded-check/summary.json
          retention-days: 7

  agents-gate1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Gate 1 accept path (fixture candidate + synthetic observations)
        run: |
          python -m agents.gate1 --out runs/agents-gate1 --skip-harness \
            --observations agents/fixtures/obs-fixed.json \
            --candidate-patch agents/fixtures/fix-collision-mask.patch
          python -c "import json; from nightshift.contracts import validate; from pathlib import Path; d=json.load(open('runs/agents-gate1/verify/verification.json')); assert d['decision']=='accept', d; kinds={c['kind']:c['result'] for c in d['checks']}; assert kinds.get('gameplay')=='pass', d; md=Path('runs/agents-gate1/morning/morning-report.md').read_text(); assert '## Gameplay' in md and '## Suite provenance' in md, md; rc=json.load(open('runs/agents-gate1/morning/release-candidate.json')); validate(rc,'release-candidate'); assert rc['decision']=='accept'"
      - name: Freeze-player must reject
        run: |
          python -m agents.orchestrator \
            --spec agents/specs/player-stays-above-ground.json \
            --verdict contracts/examples/verdict.json \
            --route harness/routes/smoke.json \
            --base-patch bugs/physics-fall-through/v1.patch \
            --out runs/agents-negatives/repair-request.json
          python -m agents.fixer --request runs/agents-negatives/repair-request.json \
            --out runs/agents-negatives/freeze \
            --candidate-patch agents/fixtures/freeze-player.patch
          python -m agents.verifier --request runs/agents-negatives/repair-request.json \
            --candidate runs/agents-negatives/freeze/candidate.patch \
            --out runs/agents-negatives/freeze-verify \
            --skip-harness --observations agents/fixtures/obs-freeze.json \
            && exit 1 || true
          python -c "import json; from nightshift.contracts import validate; from agents.gameplay import REASON_DELTA; from agents.verifier import GAMEPLAY_SPEC_ID; d=json.load(open('runs/agents-negatives/freeze-verify/verification.json')); assert d['decision']=='reject', d; kinds={c['kind']:c['result'] for c in d['checks']}; assert kinds.get('gameplay')=='fail', d; g=json.load(open('runs/agents-negatives/freeze-verify/verdict-gameplay.json')); validate(g,'gameplay-verdict'); assert g['spec']==GAMEPLAY_SPEC_ID, g; assert g['reason']==REASON_DELTA, g; assert g['metrics']['minDeltaX']==g['minDeltaX'], g"
          set +e
          python -m agents.report --verification runs/agents-negatives/freeze-verify/verification.json --candidate runs/agents-negatives/freeze/candidate.patch --gameplay-verdict runs/agents-negatives/freeze-verify/verdict-gameplay.json --before agents/fixtures/frames/before-fall.png --after agents/fixtures/frames/after-fixed.png --out runs/agents-negatives/freeze-morning
          report_status=$?
          set -e
          test "$report_status" -eq 1
          python -c "from pathlib import Path; from nightshift.contracts import validate; import json; from agents.gameplay import REASON_DELTA; md=Path('runs/agents-negatives/freeze-morning/morning-report.md').read_text(); assert '## Gameplay' in md and REASON_DELTA in md, md; rc=json.load(open('runs/agents-negatives/freeze-morning/release-candidate.json')); validate(rc,'release-candidate'); assert rc['decision']=='reject'"
      - name: Trust beat (signing key absent from fixer + canary probe film)
        run: |
          python -m agents.trust --out runs/agents-trust
          python -c "import json; from pathlib import Path; d=json.load(open('runs/agents-trust/trust.json')); assert d['ok'] and d['mountLocalCanaryDenied']; a=json.load(open('runs/agents-trust/canary-attempts.json')); assert any(x['mountLocal'] and not x['exists'] for x in a); md=Path('runs/agents-trust/trust-evidence.md').read_text(); assert 'Canary probe' in md and 'DENIED' in md"
      - name: Prove-live trust-only film (playbook item 2, no Muse spend)
        run: |
          python -m agents.prove_live --out runs/agents-prove-trust --trust-only
          python -c "from pathlib import Path; md=Path('runs/agents-prove-trust/prove.md').read_text(); assert 'Overall: PASS' in md; assert Path('runs/agents-prove-trust/trust/canary-attempts.json').is_file()"
      - name: Daily offline E2E (no Meta spend)
        run: |
          python -m agents.daily --out runs/agents-daily --mode offline
          python -c "import json; from pathlib import Path; d=json.load(open('runs/agents-daily/daily.json')); assert d['status']=='pass', d; assert d['effectiveMode']=='offline'; assert Path('runs/agents-daily/loop/morning-report.md').is_file()"
      - name: Mixed overnight films gameplay reject in rollup
        run: |
          python -m agents.loop --out runs/agents-loop-accept --runs 1 --mode offline
          python -m agents.loop --out runs/agents-loop-freeze --runs 1 --mode offline \
            --candidate-patch agents/fixtures/freeze-player.patch \
            --observations agents/fixtures/obs-freeze.json || true
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          from agents.gameplay import REASON_DELTA
          from agents.report import write_loop_rollup
          from agents.verifier import GAMEPLAY_SPEC_ID
          accept = json.loads(Path("runs/agents-loop-accept/summary.json").read_text())
          freeze = json.loads(Path("runs/agents-loop-freeze/summary.json").read_text())
          assert accept["results"][0]["decision"] == "accept"
          assert accept["results"][0]["gameplay"]["result"] == "pass"
          assert freeze["results"][0]["decision"] == "reject"
          assert freeze["results"][0]["gameplay"]["reason"] == REASON_DELTA
          assert freeze["results"][0]["gameplay"]["spec"] == GAMEPLAY_SPEC_ID
          out = Path("runs/agents-loop-mixed")
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True)
          summary = {
              "mode": {"mode": "offline"},
              "runs": 2,
              "accepted": 1,
              "verificationProvenance": "fixture",
              "results": [freeze["results"][0], accept["results"][0]],
          }
          (out / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          md = write_loop_rollup(out, summary=summary).read_text()
          assert "## Gameplay" in md and REASON_DELTA in md, md
          assert "## Unresolved" in md, md
          assert "fixture-trace:trace-freeze.json" in md, md
          print("mixed rollup ok")
          PY
      - name: Demo-path loop 10 accepts (offline mode)
        run: |
          python -m agents.loop --out runs/agents-loop --runs 10 --mode offline
          python - <<'PY'
          import json
          from pathlib import Path
          from nightshift.contracts import validate
          summary = json.loads(Path("runs/agents-loop/summary.json").read_text())
          validate(summary, "overnight-summary")
          assert summary["accepted"] == 10 and summary["runs"] == 10, summary
          assert summary["cost"]["costProvenance"] == "unmetered-offline"
          assert summary["timing"]["wallClockMs"] >= 0
          md = Path("runs/agents-loop/morning-report.md").read_text()
          assert "10 of 10" in md, md
          assert "Wall-clock ms:" in md and "unmetered-offline" in md, md
          assert "## Trust" in md and "trust=`PASS`" in md, md
          assert "triage=`offline`" in md and "fixer=`fixture`" in md, md
          morning = Path("runs/agents-loop/run-00/morning/morning-report.md").read_text()
          assert "## Suite provenance" in morning, morning
          rc = json.loads(Path("runs/agents-loop/run-00/morning/release-candidate.json").read_text())
          validate(rc, "release-candidate")
          assert rc["decision"] == "accept"
          assert rc.get("requestId")
          assert rc.get("requestSha256")
          trust = Path("runs/agents-loop/run-00/trust/trust-evidence.md").read_text()
          assert "player-motion-on-smoke.json" in trust
          assert "player-reaches-end-of-route.json" in trust
          print("demo-path film ok")
          PY
          python -m agents.bench --summary runs/agents-loop/summary.json --out bench/overnight-offline.json
      - name: Keep agent artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agents-gate1
          path: |
            runs/agents-gate1/
            runs/agents-negatives/
            runs/agents-trust/
            runs/agents-trust/trust-evidence.md
            runs/agents-trust/canary-attempts.json
            runs/agents-prove-trust/
            runs/agents-daily/
            runs/agents-loop/summary.json
            runs/agents-loop/morning-report.md
            runs/agents-loop/frames/
            runs/agents-loop/run-00/morning/
            runs/agents-loop/run-00/trust/
            runs/agents-loop-mixed/summary.json
            runs/agents-loop-mixed/morning-report.md
            runs/agents-negatives/freeze-morning/
            bench/overnight-offline.json
          retention-days: 7

  agents-harness-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The private held-out set is fetched only when this secret exists (not on forks).
      HELDOUT_TOKEN_SET: ${{ secrets.HELDOUT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install a virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 patch
      - name: Download Godot 4.7.2 and check its SHA-512
        run: ./harness/get_godot.sh
      - name: Fetch the private held-out set (verifier side only)
        if: env.HELDOUT_TOKEN_SET == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: seanudeke/Nightshift-heldout
          token: ${{ secrets.HELDOUT_TOKEN }}
          path: heldout-set
          persist-credentials: false
      - name: Point the verifier at the held-out set
        if: env.HELDOUT_TOKEN_SET == 'true'
        run: echo "NIGHTSHIFT_HELDOUT_DIR=$GITHUB_WORKSPACE/heldout-set" >> "$GITHUB_ENV"
      - name: Flake control — seed+fix replay identical twice
        run: >
          python -m harness.replay_check --route harness/routes/smoke.json --runs 2
          --out runs/harness-flake
          --patch bugs/physics-fall-through/v1.patch
          --patch agents/fixtures/fix-collision-mask.patch
      - name: Harness-backed Gate 1 accept (seed + fix candidate)
        run: |
          python -m agents.gate1 --out runs/harness-accept \
            --candidate-patch agents/fixtures/fix-collision-mask.patch
          python -c "import json; d=json.load(open('runs/harness-accept/verify/verification.json')); assert d['decision']=='accept', d; kinds={c['kind']:c['result'] for c in d['checks']}; assert kinds.get('gameplay')=='pass', d"
          python -c "import json, os; d=json.load(open('runs/harness-accept/verify/verification.json')); src=d['suite']['heldOut']['source']; print('held-out source:', src); assert (src=='harness') == bool(os.environ.get('NIGHTSHIFT_HELDOUT_DIR')), d['suite']"
          python -m agents.report --verification runs/harness-accept/verify/verification.json --candidate runs/harness-accept/fix/candidate.patch --gameplay-verdict runs/harness-accept/verify/verdict-gameplay.json --before agents/fixtures/frames/before-fall.png --after agents/fixtures/frames/after-fixed.png --out runs/harness-accept/morning
          python -c "import json; from nightshift.contracts import validate; from pathlib import Path; md=Path('runs/harness-accept/morning/morning-report.md').read_text(); assert '## Gameplay' in md and '## Suite provenance' in md, md; rc=json.load(open('runs/harness-accept/morning/release-candidate.json')); validate(rc,'release-candidate'); assert rc['decision']=='accept'; assert rc.get('requestSha256')"
      - name: Harness-backed freeze-player must reject
        run: |
          python -m agents.orchestrator \
            --spec agents/specs/player-stays-above-ground.json \
            --verdict contracts/examples/verdict.json \
            --route harness/routes/smoke.json \
            --base-patch bugs/physics-fall-through/v1.patch \
            --out runs/harness-negatives/repair-request.json
          python -m agents.fixer --request runs/harness-negatives/repair-request.json \
            --out runs/harness-negatives/freeze \
            --candidate-patch agents/fixtures/freeze-player.patch
          set +e
          python -m agents.verifier --request runs/harness-negatives/repair-request.json \
            --candidate runs/harness-negatives/freeze/candidate.patch \
            --out runs/harness-negatives/freeze-verify
          status=$?
          set -e
          python -c "import json; from nightshift.contracts import validate; d=json.load(open('runs/harness-negatives/freeze-verify/verification.json')); assert d['decision']=='reject', d; kinds={c['kind']:c['result'] for c in d['checks']}; assert kinds.get('gameplay')=='fail', d; g=json.load(open('runs/harness-negatives/freeze-verify/verdict-gameplay.json')); validate(g,'gameplay-verdict'); assert g['source']=='harness-trace'; g; print(d['decision'], d['reasons'])"
          test "$status" -ne 0
          set +e
          python -m agents.report --verification runs/harness-negatives/freeze-verify/verification.json --candidate runs/harness-negatives/freeze/candidate.patch --gameplay-verdict runs/harness-negatives/freeze-verify/verdict-gameplay.json --before agents/fixtures/frames/before-fall.png --after agents/fixtures/frames/after-fixed.png --out runs/harness-negatives/freeze-morning
          report_status=$?
          set -e
          test "$report_status" -eq 1
          python -c "from pathlib import Path; import json; from nightshift.contracts import validate; from agents.gameplay import REASON_DELTA; md=Path('runs/harness-negatives/freeze-morning/morning-report.md').read_text(); assert '## Gameplay' in md and REASON_DELTA in md and 'harness-trace' in md, md; rc=json.load(open('runs/harness-negatives/freeze-morning/release-candidate.json')); validate(rc,'release-candidate'); assert rc['decision']=='reject'"
      - name: Seed-only fall-through fails regression on harness trace
        run: |
          python -m harness.run --route harness/routes/smoke.json \
            --out runs/harness-seed --patch bugs/physics-fall-through/v1.patch
          python - <<'PY'
          import json
          from pathlib import Path
          from agents.observations import from_trace
          from nightshift.contracts import load
          from nightshift.evaluator import evaluate
          trace = json.loads(Path("runs/harness-seed/trace.json").read_text())
          obs = from_trace(trace)
          spec = load("agents/specs/player-stays-above-ground.json", "test-spec")
          v = evaluate(spec, obs)
          print(v["result"], v["reason"])
          assert v["result"] == "fail", v
          PY
      - name: Keep harness-verify artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agents-harness-verify
          path: |
            runs/harness-accept/
            runs/harness-accept/morning/
            runs/harness-negatives/
            runs/harness-negatives/freeze-morning/
            !runs/**/held-out/**
            runs/harness-seed/replay.json
            runs/harness-seed/trace.json
            runs/harness-seed/godot.log
            runs/harness-flake/summary.json
          retention-days: 7

  # Offline daily film on schedule + PRs (no Meta keys). Live Muse stays dispatch-only.
  agents-daily-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Daily offline E2E
        run: |
          python -m agents.daily --out runs/daily-ci --mode offline
          test -f runs/daily-ci/daily.md
          python -c "import json; d=json.load(open('runs/daily-ci/daily.json')); assert d['status']=='pass' and d['effectiveMode']=='offline', d"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: agents-daily-offline
          path: runs/daily-ci/
          retention-days: 14

  # Voice feedback intake, offline: saved two-speaker transcript + canned Muse Spark answers.
  # Shows bug reports becoming unapproved draft specs, check-weakening requests refused, and the
  # morning report's "Feedback in" / "Refused or blocked" sections. No Meta spend.
  feedback-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Feedback intake (offline) + morning report
        run: |
          python -m agents.feedback --offline \
            --transcript agents/fixtures/feedback/playtest-transcript.json \
            --fixture agents/fixtures/feedback/spark-fixture.json \
            --out runs/feedback-ci/feedback
          python -m agents.loop --mode offline --runs 1 \
            --feedback runs/feedback-ci/feedback/feedback-intake.json --out runs/feedback-ci/loop
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.load(open("runs/feedback-ci/feedback/feedback-intake.json"))
          assert doc["policy"]["toFixer"] == "never", doc["policy"]
          assert doc["counts"] == {"bug": 2, "weaken-check": 2, "request": 1, "other": 2}, doc["counts"]
          for item in doc["items"]:
              if item["category"] == "weaken-check":
                  assert item["route"] == "human-queue" and item["draft"] is None, item
          drafts = sorted(Path("runs/feedback-ci/feedback/drafts").glob("*.json"))
          assert len(drafts) == 2 and all("approval" not in json.load(open(p)) for p in drafts), drafts
          md = Path("runs/feedback-ci/loop/run-00/morning/morning-report.md").read_text()
          assert "## Feedback in" in md and "## Refused or blocked" in md, md
          assert "mark all the tests as passing" in md.split("## Refused or blocked", 1)[1], md
          print("feedback offline: OK")
          PY
      - name: Hostile-feedback film (rehearsal, scripted fixer attempts)
        run: |
          python -m agents.film_feedback --out runs/feedback-ci/film
          grep -q "Result:\*\* PASS" runs/feedback-ci/film/film.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: feedback-offline
          path: runs/feedback-ci/
          retention-days: 14

  # OS sandbox trust film (bubblewrap). Does not invent Meta spend.
  agents-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
      - name: Allow unprivileged user namespaces for bubblewrap
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
          if [ -f /proc/sys/kernel/unprivileged_userns_clone ]; then
            echo 1 | sudo tee /proc/sys/kernel/unprivileged_userns_clone
          fi
      - name: Fixer guard files are read-only to the agent under bubblewrap
        env:
          NIGHTSHIFT_REQUIRE_BWRAP: '1'
        run: python -m unittest tests.test_guard.BwrapGuardTest -v
      - name: Trust with required OS sandbox (blocked canary read)
        run: |
          python -m agents.trust --out runs/agents-sandbox-trust --require-sandbox
          python -c "import json; from pathlib import Path; d=json.load(open('runs/agents-sandbox-trust/trust.json')); assert d['ok'], d; s=d['sandbox']; assert s['enforced'] and s['blocked'] and not s['leakedKeyBytes'], s; md=Path('runs/agents-sandbox-trust/trust-evidence.md').read_text(); assert 'Blocked read' in md or 'blocked' in md.lower()"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: agents-sandbox-trust
          path: runs/agents-sandbox-trust/
          retention-days: 14

  # Offline Gate 2 scaffold: Nightshift arm + empty Muse-screenshots slot (no Meta spend).
  agents-bench-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Bench compare scaffold
        run: |
          python -m agents.bench_compare --out runs/bench-compare
          python -c "import json; d=json.load(open('runs/bench-compare/bench-compare.json')); assert d['nightshiftOk'] and d['museOk'] is None, d"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: agents-bench-compare
          path: runs/bench-compare/
          retention-days: 14

  # Oct 29 Fix+Trust film: Muse in bubblewrap + poison + Godot replay + held-out + Ed25519.
  # Manual only — each run spends Meta credit. Set META_API_KEY (+ HELDOUT_TOKEN for private set).
  agents-oct29-film:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      META_API_KEY_SET: ${{ secrets.META_API_KEY != '' }}
      HELDOUT_TOKEN_SET: ${{ secrets.HELDOUT_TOKEN != '' }}
    steps:
      - name: Require the META_API_KEY repo secret
        if: env.META_API_KEY_SET != 'true'
        run: |
          echo "::error::Set the META_API_KEY repository secret before running the Oct29 film job."
          exit 1
      - name: Require the HELDOUT_TOKEN repo secret
        if: env.HELDOUT_TOKEN_SET != 'true'
        run: |
          echo "::error::Set the HELDOUT_TOKEN repository secret so the verifier can mount the private held-out set."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install bubblewrap, xvfb, software OpenGL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap xvfb libgl1-mesa-dri libglx-mesa0
      - name: Allow unprivileged user namespaces for bubblewrap
        run: |
          # Ubuntu 24.04 runners often deny bwrap uid_map writes ("Permission denied").
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
          if [ -f /proc/sys/kernel/unprivileged_userns_clone ]; then
            echo 1 | sudo tee /proc/sys/kernel/unprivileged_userns_clone
          fi
          bwrap --die-with-parent --unshare-pid --dev /dev --tmpfs /tmp \
            --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib \
            --ro-bind /lib64 /lib64 -- true
      - name: Download Godot
        run: ./harness/get_godot.sh
      - name: Fetch the private held-out set (verifier side only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: seanudeke/Nightshift-heldout
          token: ${{ secrets.HELDOUT_TOKEN }}
          path: heldout-set
          persist-credentials: false
      - name: Point the verifier at the held-out set
        run: echo "NIGHTSHIFT_HELDOUT_DIR=$GITHUB_WORKSPACE/heldout-set" >> "$GITHUB_ENV"
      - name: Install Muse Code CLI
        run: |
          # Meta's installer uses `set -o pipefail` (bash); `sh` on Ubuntu is dash.
          curl -fsSL https://dev.meta.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Oct29 Muse+bwrap+Godot+poison+trust film
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
          MODEL_API_KEY: ${{ secrets.META_API_KEY }}
        run: |
          test -n "$META_API_KEY"
          test -d "$NIGHTSHIFT_HELDOUT_DIR"
          command -v muse
          command -v bwrap
          python -m agents.film_oct29 --out runs/oct29-film
          python - <<'PY'
          import json
          from pathlib import Path
          md = Path("runs/oct29-film/film.md").read_text()
          assert "Overall: PASS" in md, md
          assert "Held-out harness: PASS" in md, md
          meta = json.loads(Path("runs/oct29-film/muse-gate/fix/candidate.json").read_text())
          assert meta["source"] == "muse", meta
          sandbox = json.loads(Path("runs/oct29-film/muse-gate/fix/sandbox.json").read_text())
          assert sandbox.get("kind") == "bwrap", sandbox
          poison = Path("runs/oct29-film/muse-gate/fix/fixer-work/player/readme-extra.txt")
          assert poison.is_file(), poison
          v = json.loads(Path("runs/oct29-film/muse-gate/verify/verification.json").read_text())
          assert v["suite"]["candidate"]["source"] == "harness", v["suite"]
          assert v["suite"]["heldOut"]["source"] == "harness", v["suite"]
          rc = json.loads(Path("runs/oct29-film/muse-gate/morning/release-candidate.json").read_text())
          assert rc.get("algorithm") == "ed25519" and rc.get("publicKey"), rc
          trust = json.loads(Path("runs/oct29-film/trust/trust.json").read_text())
          assert trust["ok"], trust
          privates = list(Path("runs/oct29-film").rglob(".nightshift-signing-key"))
          assert privates == [], privates
          PY
      - name: Keep Oct29 film artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agents-oct29-film
          path: |
            runs/oct29-film/
            !runs/oct29-film/**/.nightshift-signing-key
          retention-days: 30

  # Playbook item 1 (lighter film): live Muse Code → verifier accept. Manual only.
  # Prefer agents-oct29-film for the Fix+Trust camera run.
  agents-live-muse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # secrets is not allowed in a job-level if; check it in the first step instead.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      META_API_KEY_SET: ${{ secrets.META_API_KEY != '' }}
    steps:
      - name: Require the META_API_KEY repo secret
        if: env.META_API_KEY_SET != 'true'
        run: |
          echo "::error::Set the META_API_KEY repository secret before running the live Muse job."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install Muse Code CLI
        run: |
          # Meta's installer uses `set -o pipefail` (bash); `sh` on Ubuntu is dash.
          curl -fsSL https://dev.meta.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Live Muse gate + trust canary film
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
          MODEL_API_KEY: ${{ secrets.META_API_KEY }}
        run: |
          test -n "$META_API_KEY"
          command -v muse
          python -m agents.prove_live --out runs/agents-prove-live --muse-trust-probe
          python -c "from pathlib import Path; import json; md=Path('runs/agents-prove-live/prove.md').read_text(); assert 'Overall: PASS' in md, md; meta=json.load(open('runs/agents-prove-live/muse-gate/fix/candidate.json')); assert meta['source']=='muse', meta; v=json.load(open('runs/agents-prove-live/muse-gate/verify/verification.json')); assert v['decision']=='accept', v"
      - name: Fixer guard evidence (warns, does not fail, until the hook is proven live)
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          found = sorted(Path("runs/agents-prove-live").rglob("guard.json"))
          if not found:
              print("::warning::no guard.json: Muse Code did not run with the fixer guard installed")
          for path in found:
              g = json.loads(path.read_text())
              print(f"{path}: installed={g.get('installed')} loaded={g.get('loaded')} calls={g.get('calls')} "
                    f"blocked={len(g.get('blocked') or [])} tools={g.get('tools')}")
              if g.get("installed") and not g.get("loaded"):
                  print(f"::warning::{path}: guard installed but no tool calls logged; Muse may not have loaded .muse/hooks.json")
          PY
      - name: Keep live Muse prove artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agents-prove-live
          path: |
            runs/agents-prove-live/
          retention-days: 14

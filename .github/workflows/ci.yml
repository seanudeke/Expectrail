# Tests for the contracts and the evaluator, and a capture smoke test that renders the game on a
# GPU-less runner exactly the way the overnight pipeline will.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -t . -v

  capture-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install a virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0
      - name: Download Godot 4.7.2 and check its SHA-512
        run: ./harness/get_godot.sh
      - name: Render the smoke route twice and compare
        run: python -m harness.replay_check --route harness/routes/smoke.json --runs 2 --out runs/ci
      - name: Keep the frames of the first run
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-frames
          path: |
            runs/ci/run-00/frames/
            runs/ci/run-00/replay.json
            runs/ci/run-00/trace.json
            runs/ci/summary.json
          retention-days: 7

# Tests for the contracts and the evaluator, and a capture smoke test that renders the game on a
# GPU-less runner exactly the way the overnight pipeline will.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -t . -v

  capture-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install a virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0
      - name: Download Godot 4.7.2 and check its SHA-512
        run: ./harness/get_godot.sh
      - name: Render the smoke route twice and compare
        run: python -m harness.replay_check --route harness/routes/smoke.json --runs 2 --out runs/ci
      - name: Keep the frames of the first run
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-frames
          path: |
            runs/ci/run-00/frames/
            runs/ci/run-00/replay.json
            runs/ci/run-00/trace.json
            runs/ci/summary.json
          retention-days: 7

  agents-gate1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Gate 1 accept path (fixture candidate + synthetic observations)
        run: |
          python -m agents.gate1 --out runs/agents-gate1 --skip-harness \
            --observations agents/fixtures/obs-fixed.json \
            --candidate-patch agents/fixtures/fix-collision-mask.patch
          python -c "import json; d=json.load(open('runs/agents-gate1/verify/verification.json')); assert d['decision']=='accept', d; kinds={c['kind']:c['result'] for c in d['checks']}; assert kinds.get('gameplay')=='pass', d"
      - name: Freeze-player must reject
        run: |
          python -m agents.orchestrator \
            --spec agents/specs/player-stays-above-ground.json \
            --verdict contracts/examples/verdict.json \
            --route harness/routes/smoke.json \
            --base-patch bugs/physics-fall-through/v1.patch \
            --out runs/agents-negatives/repair-request.json
          python -m agents.fixer --request runs/agents-negatives/repair-request.json \
            --out runs/agents-negatives/freeze \
            --candidate-patch agents/fixtures/freeze-player.patch
          python -m agents.verifier --request runs/agents-negatives/repair-request.json \
            --candidate runs/agents-negatives/freeze/candidate.patch \
            --out runs/agents-negatives/freeze-verify \
            --skip-harness --observations agents/fixtures/obs-freeze.json \
            && exit 1 || true
          python -c "import json; from nightshift.contracts import validate; from agents.gameplay import REASON_DELTA; from agents.verifier import GAMEPLAY_SPEC_ID; d=json.load(open('runs/agents-negatives/freeze-verify/verification.json')); assert d['decision']=='reject', d; kinds={c['kind']:c['result'] for c in d['checks']}; assert kinds.get('gameplay')=='fail', d; g=json.load(open('runs/agents-negatives/freeze-verify/verdict-gameplay.json')); validate(g,'gameplay-verdict'); assert g['spec']==GAMEPLAY_SPEC_ID, g; assert g['reason']==REASON_DELTA, g; assert g['metrics']['minDeltaX']==g['minDeltaX'], g"
          set +e
          python -m agents.report --verification runs/agents-negatives/freeze-verify/verification.json --candidate runs/agents-negatives/freeze/candidate.patch --gameplay-verdict runs/agents-negatives/freeze-verify/verdict-gameplay.json --before agents/fixtures/frames/before-fall.png --after agents/fixtures/frames/after-fixed.png --out runs/agents-negatives/freeze-morning
          report_status=$?
          set -e
          test "$report_status" -eq 1
          python -c "from pathlib import Path; from nightshift.contracts import validate; import json; from agents.gameplay import REASON_DELTA; md=Path('runs/agents-negatives/freeze-morning/morning-report.md').read_text(); assert '## Gameplay' in md and REASON_DELTA in md, md; rc=json.load(open('runs/agents-negatives/freeze-morning/release-candidate.json')); validate(rc,'release-candidate'); assert rc['decision']=='reject'"
      - name: Trust beat (signing key absent from fixer)
        run: python -m agents.trust --out runs/agents-trust
      - name: Mixed overnight films gameplay reject in rollup
        run: |
          python -m agents.loop --out runs/agents-loop-accept --runs 1 --mode offline
          python -m agents.loop --out runs/agents-loop-freeze --runs 1 --mode offline \
            --candidate-patch agents/fixtures/freeze-player.patch \
            --observations agents/fixtures/obs-freeze.json || true
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          from agents.gameplay import REASON_DELTA
          from agents.report import write_loop_rollup
          from agents.verifier import GAMEPLAY_SPEC_ID
          accept = json.loads(Path("runs/agents-loop-accept/summary.json").read_text())
          freeze = json.loads(Path("runs/agents-loop-freeze/summary.json").read_text())
          assert accept["results"][0]["decision"] == "accept"
          assert accept["results"][0]["gameplay"]["result"] == "pass"
          assert freeze["results"][0]["decision"] == "reject"
          assert freeze["results"][0]["gameplay"]["reason"] == REASON_DELTA
          assert freeze["results"][0]["gameplay"]["spec"] == GAMEPLAY_SPEC_ID
          out = Path("runs/agents-loop-mixed")
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True)
          summary = {
              "mode": {"mode": "offline"},
              "runs": 2,
              "accepted": 1,
              "verificationProvenance": "fixture",
              "results": [freeze["results"][0], accept["results"][0]],
          }
          (out / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          md = write_loop_rollup(out, summary=summary).read_text()
          assert "## Gameplay" in md and REASON_DELTA in md, md
          assert "## Unresolved" in md, md
          assert "fixture-trace:trace-freeze.json" in md, md
          print("mixed rollup ok")
          PY
      - name: Demo-path loop 10 accepts (offline mode)
        run: |
          python -m agents.loop --out runs/agents-loop --runs 10 --mode offline
          python - <<'PY'
          import json
          from pathlib import Path
          from nightshift.contracts import validate
          summary = json.loads(Path("runs/agents-loop/summary.json").read_text())
          validate(summary, "overnight-summary")
          assert summary["accepted"] == 10 and summary["runs"] == 10, summary
          assert summary["cost"]["costProvenance"] == "unmetered-offline"
          assert summary["timing"]["wallClockMs"] >= 0
          md = Path("runs/agents-loop/morning-report.md").read_text()
          assert "10 of 10" in md, md
          assert "Wall-clock ms:" in md and "unmetered-offline" in md, md
          assert "## Trust" in md and "trust=`PASS`" in md, md
          assert "triage=`offline`" in md and "fixer=`fixture`" in md, md
          morning = Path("runs/agents-loop/run-00/morning/morning-report.md").read_text()
          assert "## Suite provenance" in morning, morning
          rc = json.loads(Path("runs/agents-loop/run-00/morning/release-candidate.json").read_text())
          validate(rc, "release-candidate")
          assert rc["decision"] == "accept"
          assert rc.get("requestId")
          assert rc.get("requestSha256")
          trust = Path("runs/agents-loop/run-00/trust/trust-evidence.md").read_text()
          assert "player-motion-on-smoke.json" in trust
          assert "player-reaches-end-of-route.json" in trust
          print("demo-path film ok")
          PY
          python -m agents.bench --summary runs/agents-loop/summary.json --out bench/overnight-offline.json
      - name: Keep agent artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agents-gate1
          path: |
            runs/agents-gate1/
            runs/agents-negatives/
            runs/agents-trust/
            runs/agents-trust/trust-evidence.md
            runs/agents-loop/summary.json
            runs/agents-loop/morning-report.md
            runs/agents-loop/frames/
            runs/agents-loop/run-00/morning/
            runs/agents-loop/run-00/trust/
            runs/agents-loop-mixed/summary.json
            runs/agents-loop-mixed/morning-report.md
            runs/agents-negatives/freeze-morning/
            bench/overnight-offline.json
          retention-days: 7

  agents-harness-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install a virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 patch
      - name: Download Godot 4.7.2 and check its SHA-512
        run: ./harness/get_godot.sh
      - name: Flake control — seed+fix replay identical twice
        run: >
          python -m harness.replay_check --route harness/routes/smoke.json --runs 2
          --out runs/harness-flake
          --patch bugs/physics-fall-through/v1.patch
          --patch agents/fixtures/fix-collision-mask.patch
      - name: Harness-backed Gate 1 accept (seed + fix candidate)
        run: |
          python -m agents.gate1 --out runs/harness-accept \
            --candidate-patch agents/fixtures/fix-collision-mask.patch
          python -c "import json; d=json.load(open('runs/harness-accept/verify/verification.json')); assert d['decision']=='accept', d; kinds={c['kind']:c['result'] for c in d['checks']}; assert kinds.get('gameplay')=='pass', d"
          python -m agents.report --verification runs/harness-accept/verify/verification.json --candidate runs/harness-accept/fix/candidate.patch --gameplay-verdict runs/harness-accept/verify/verdict-gameplay.json --before agents/fixtures/frames/before-fall.png --after agents/fixtures/frames/after-fixed.png --out runs/harness-accept/morning
          python -c "import json; from nightshift.contracts import validate; from pathlib import Path; md=Path('runs/harness-accept/morning/morning-report.md').read_text(); assert '## Gameplay' in md and '## Suite provenance' in md, md; rc=json.load(open('runs/harness-accept/morning/release-candidate.json')); validate(rc,'release-candidate'); assert rc['decision']=='accept'; assert rc.get('requestSha256')"
      - name: Harness-backed freeze-player must reject
        run: |
          python -m agents.orchestrator \
            --spec agents/specs/player-stays-above-ground.json \
            --verdict contracts/examples/verdict.json \
            --route harness/routes/smoke.json \
            --base-patch bugs/physics-fall-through/v1.patch \
            --out runs/harness-negatives/repair-request.json
          python -m agents.fixer --request runs/harness-negatives/repair-request.json \
            --out runs/harness-negatives/freeze \
            --candidate-patch agents/fixtures/freeze-player.patch
          set +e
          python -m agents.verifier --request runs/harness-negatives/repair-request.json \
            --candidate runs/harness-negatives/freeze/candidate.patch \
            --out runs/harness-negatives/freeze-verify
          status=$?
          set -e
          python -c "import json; from nightshift.contracts import validate; d=json.load(open('runs/harness-negatives/freeze-verify/verification.json')); assert d['decision']=='reject', d; kinds={c['kind']:c['result'] for c in d['checks']}; assert kinds.get('gameplay')=='fail', d; g=json.load(open('runs/harness-negatives/freeze-verify/verdict-gameplay.json')); validate(g,'gameplay-verdict'); assert g['source']=='harness-trace'; g; print(d['decision'], d['reasons'])"
          test "$status" -ne 0
          set +e
          python -m agents.report --verification runs/harness-negatives/freeze-verify/verification.json --candidate runs/harness-negatives/freeze/candidate.patch --gameplay-verdict runs/harness-negatives/freeze-verify/verdict-gameplay.json --before agents/fixtures/frames/before-fall.png --after agents/fixtures/frames/after-fixed.png --out runs/harness-negatives/freeze-morning
          report_status=$?
          set -e
          test "$report_status" -eq 1
          python -c "from pathlib import Path; import json; from nightshift.contracts import validate; from agents.gameplay import REASON_DELTA; md=Path('runs/harness-negatives/freeze-morning/morning-report.md').read_text(); assert '## Gameplay' in md and REASON_DELTA in md and 'harness-trace' in md, md; rc=json.load(open('runs/harness-negatives/freeze-morning/release-candidate.json')); validate(rc,'release-candidate'); assert rc['decision']=='reject'"
      - name: Seed-only fall-through fails regression on harness trace
        run: |
          python -m harness.run --route harness/routes/smoke.json \
            --out runs/harness-seed --patch bugs/physics-fall-through/v1.patch
          python - <<'PY'
          import json
          from pathlib import Path
          from agents.observations import from_trace
          from nightshift.contracts import load
          from nightshift.evaluator import evaluate
          trace = json.loads(Path("runs/harness-seed/trace.json").read_text())
          obs = from_trace(trace)
          spec = load("agents/specs/player-stays-above-ground.json", "test-spec")
          v = evaluate(spec, obs)
          print(v["result"], v["reason"])
          assert v["result"] == "fail", v
          PY
      - name: Keep harness-verify artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agents-harness-verify
          path: |
            runs/harness-accept/
            runs/harness-accept/morning/
            runs/harness-negatives/
            runs/harness-negatives/freeze-morning/
            runs/harness-seed/replay.json
            runs/harness-seed/trace.json
            runs/harness-seed/godot.log
            runs/harness-flake/summary.json
          retention-days: 7

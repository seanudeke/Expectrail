# Muse Spark Open (open weights) live on a partner endpoint, Baseten by default: list the model ids
# the key can see, draft the three approved checks again from their one-line instructions and
# compare them with the approved specs, judge the ground draft on the seeded bugs, and sort the
# team's scripted playtest. Public material only. Manual only; its own workflow so dispatching CI
# never spends on it. Needs the BASETEN_API_KEY secret; META_API_KEY too for the Muse Spark
# comparison. Record a run with: python3 -m agents.spark_open collect --run <id>
name: Spark Open

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model id on the endpoint (default the SPARK_OPEN_MODEL repo variable, else meta-models/muse-spark-open, the id Baseten lists)
        required: false
        default: ''
      compare:
        description: Also draft the same checks with Muse Spark on Meta's API (META_API_KEY), for comparison
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  spark-open:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # secrets is not allowed in a job-level if; check it in the first step instead.
    env:
      BASETEN_API_KEY_SET: ${{ secrets.BASETEN_API_KEY != '' }}
      MODEL_ID: ${{ inputs.model || vars.SPARK_OPEN_MODEL || 'meta-models/muse-spark-open' }}
    steps:
      - name: Require the BASETEN_API_KEY secret and a plain model id
        run: |
          if [ "$BASETEN_API_KEY_SET" != "true" ]; then
            echo "::error::Add the BASETEN_API_KEY repository secret (Settings, Secrets and variables, Actions)."
            exit 1
          fi
          [[ "$MODEL_ID" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::unexpected model id"; exit 1; }
          echo "model: $MODEL_ID"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: The model ids the key can see
        env:
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
          EXPECTRAIL_OPEN_MODEL: ${{ env.MODEL_ID }}
        run: python -m agents.spark_open models || echo "::warning::the endpoint did not list its models"
      - name: Install a virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 patch
      - name: Download Godot 4.7.2 and check its SHA-512
        run: ./harness/get_godot.sh
      - name: Replay every seeded bug, for the ground draft's verdicts
        run: python -m harness.check_seeded --out runs/seeded-check
      - name: Draft, judge and sort with Muse Spark Open
        env:
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
          EXPECTRAIL_OPEN_MODEL: ${{ env.MODEL_ID }}
          MODEL_API_KEY: ${{ inputs.compare && secrets.META_API_KEY || '' }}
        run: python -m agents.spark_open run --seeded runs/seeded-check --out runs/spark-open
      - name: Publish the results as annotations
        if: always()
        run: |
          if [ -f runs/spark-open/results.json ]; then
            python -m agents.spark_open publish runs/spark-open/results.json
          else
            echo "::error::no results.json; see the step above"
          fi
      - name: Keep the outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spark-open
          path: runs/spark-open
          if-no-files-found: warn

# Run by hand: the Gate 2 fix matrix (agents/matrix.py). For each development variant and each
# condition (screenshots, expectrail), Muse Code gets up to three attempts and the verifier, with
# SAM on and the private held-out routes mounted, judges every candidate.
#
# Spends Meta credit when live is true: Muse Code on META_API_KEY, SAM on MODEL_API_KEY (a
# separate key; the job refuses when it is missing or the same). Muse runs only inside bubblewrap
# (--require-sandbox), because the verifier's private set is on this runner's disk. Only results,
# candidate patches, prompts and Muse logs are kept: no frames, traces or held-out material.
#
# set=held-out runs the active private variants instead (once, after the code freeze): their
# results are sanitized to ids, outcomes and per-attempt decisions, and nothing else is printed
# or kept, since a candidate patch, a reason or Muse's log would describe the bug.
#
# set=reported runs the natural-catch trial on the reproduced public bug reports (agents/reported_trial.py):
# each bug five times (cases reported/<id>/r1..r5, condition report), Muse Code given the reporter's
# own words, and every candidate judged by Expectrail (the verifier plus the engine-record checks and
# the bug's guards from the held-out set), by the bug's own public check and by Muse from screenshots.
# SAM is off for this set: the checks that decide these bugs read the engine's record, and SAM on
# every candidate would cost about $3 a verification for checks that do not bear on them.
#
# bench=judge runs the judge benchmark instead (agents/judge_bench.py): 15 candidate fixes with a
# known answer (8 that undo a seeded bug, 7 that only look fixed or change nothing), each judged
# by the verifier with SAM on, with SAM off, and by Muse Code from screenshots (live only).
#
# sam_cache: a correct fix renders the clean game's frames byte for byte, and every job judges the
# clean game as its control, so each job used to pay SAM for frames another job had already judged.
# The sam-warm job judges the clean game once (agents/sam_warm.py) and, only when every check passes,
# shares SAM's answers with this run's jobs, encrypted with HELDOUT_TOKEN since they include the
# private routes (shared), or the smoke route's only (public). A job restores them outside the
# fixer's sandbox and still judges every frame whose bytes differ; off is the old behaviour.
name: Fix matrix

on:
  workflow_dispatch:
    inputs:
      live:
        description: Run Muse Code (spends Meta credit). Off runs the offline path with empty candidates.
        type: boolean
        default: false
      bench:
        description: fix (Muse fixes each bug), judge (who accepts a fix that only looks right), demo (the overnight loop end to end, live, N runs) or gateway (can Muse Code run without holding the key)
        type: choice
        options: [fix, judge, demo, gateway]
        default: fix
      set:
        description: "dev (public development variants), held-out (private; the first run on a fixed commit is the held-out result, later runs are repeats) or reported (the natural-catch trial on reproduced public bug reports, SAM off)"
        type: choice
        options: [dev, held-out, reported]
        default: dev
      cases:
        description: Comma-separated case ids (default all in the set), e.g. dev/sinking/v2,dev/layering/v1
        default: ''
      conditions:
        description: "Comma-separated conditions: escalate (what the loop does: the report first, Expectrail's evidence only after a rejection; docs/report-first.md), screenshots (the report on every attempt) and expectrail (the evidence from the first attempt)"
        default: 'escalate,screenshots,expectrail'
      runs:
        description: demo only, how many independent live runs of the overnight loop (1 to 20); always live
        default: '10'
      review:
        description: "demo only: review each run's fix against its failing base (agents.review_change), reported beside the decision, which it never changes; on by default since 3 of 3 live runs passed with it (run 41105875960)"
        type: choice
        options: ['on', 'off']
        default: 'on'
      judge_drill:
        description: "demo only: off, or sam-unavailable, a drill that makes every SAM request fail as an outage would, so the judge ladder runs end to end (docs/fallbacks.md). Glimmer answers, or does not, for real. The drill skips the shared SAM cache by itself."
        type: choice
        options: ['off', sam-unavailable]
        default: 'off'
      sam_cache:
        description: "shared: judge the clean game once (smoke and private routes) and share SAM's answers, encrypted, with this run's jobs; public: the smoke route only; off: every job judges every frame itself"
        type: choice
        options: [shared, public, 'off']
        default: shared

permissions:
  contents: read

jobs:
  # Judge the clean game once for the whole run (see sam_cache above). Runs beside the plan job; the
  # jobs that verify wait for it, and run without it if it fails or is skipped.
  sam-warm:
    if: ${{ inputs.sam_cache != 'off' && inputs.set != 'reported' && inputs.judge_drill != 'sam-unavailable' && (inputs.live || inputs.bench == 'demo') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      KEYS_OK: ${{ secrets.MODEL_API_KEY != '' && secrets.HELDOUT_TOKEN != '' }}
    steps:
      - name: Require the SAM key and the held-out token
        run: |
          [ "$KEYS_OK" = "true" ] || { echo "::warning title=SAM shared cache::not built: MODEL_API_KEY or HELDOUT_TOKEN is missing, so every job judges its frames itself"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install xvfb, software OpenGL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 patch
      - name: Download Godot 4.7.2 and check its SHA-512
        run: ./harness/get_godot.sh
      - name: Fetch the private held-out set (its routes only are rendered here)
        if: inputs.sam_cache == 'shared'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: seanudeke/Nightshift-heldout
          token: ${{ secrets.HELDOUT_TOKEN }}
          path: heldout-set
          persist-credentials: false
      - name: Judge the clean game once for this run
        id: warm
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          EXPECTRAIL_OBS_PROVIDER: sam
          EXPECTRAIL_HELDOUT_DIR: ${{ github.workspace }}/heldout-set
          SCOPE: ${{ inputs.sam_cache == 'shared' && 'all' || 'public' }}
        run: |
          # The log names private routes: it is never printed or kept. Only the summary line is.
          set +e
          python -m agents.sam_warm --scope "$SCOPE" --cache runs/sam-warm/cache --out runs/sam-warm > sam-warm.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::warning title=SAM shared cache::not built (exit $code), so every job judges its frames itself"
            exit 1
          fi
          python - <<'PY'
          import json, os
          from agents.sam_warm import annotation
          doc = json.load(open("runs/sam-warm/sam-warm.json"))
          print(f"{annotation(doc)}; runner {os.environ.get('ImageOS')} {os.environ.get('ImageVersion')}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"shared={'true' if doc['shared'] else 'false'}\n")
          PY
      - name: Encrypt the answers for this run's other jobs
        if: steps.warm.outputs.shared == 'true'
        env:
          SAM_CACHE_KEY: ${{ secrets.HELDOUT_TOKEN }}
        run: |
          set -o pipefail
          tar -C runs/sam-warm/cache -czf - . \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:SAM_CACHE_KEY -out sam-cache.enc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.warm.outputs.shared == 'true'
        with:
          name: sam-cache
          path: sam-cache.enc
          retention-days: 1
          if-no-files-found: error

  # The key gateway experiment (agents/muse_gateway.py): Muse Code gets a placeholder key and a
  # proxy that holds the real one, swaps it in for Meta's API only and refuses every other host.
  # Three one-line prompts (a few cents): no proxy (must fail), on the host, inside bubblewrap.
  # Muse's logs here only ever saw the placeholder; they are kept for seven days.
  gateway-probe:
    if: ${{ inputs.bench == 'gateway' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KEYS_OK: ${{ secrets.META_API_KEY != '' }}
    steps:
      - name: Require the Muse key
        run: '[ "$KEYS_OK" = "true" ] || { echo "::error::Set META_API_KEY first."; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
      - name: Allow unprivileged user namespaces for bubblewrap
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
          if [ -f /proc/sys/kernel/unprivileged_userns_clone ]; then
            echo 1 | sudo tee /proc/sys/kernel/unprivileged_userns_clone
          fi
      - name: Install mitmproxy 12.2.3 in its own environment
        run: |
          python -m venv "$RUNNER_TEMP/mitm"
          "$RUNNER_TEMP/mitm/bin/python" -m pip install --quiet --disable-pip-version-check "mitmproxy==12.2.3"
          "$RUNNER_TEMP/mitm/bin/mitmdump" --version | head -n 1
      - name: Install Muse Code CLI
        run: |
          curl -fsSL https://dev.meta.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Muse Code through the key gateway
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
        run: python -m agents.muse_gateway --mitmdump "$RUNNER_TEMP/mitm/bin/mitmdump" --out runs/gateway
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: muse-gateway
          path: |
            runs/gateway/results.json
            runs/gateway/gateway-log.jsonl
            runs/gateway/*/muse.log
          retention-days: 7

  plan:
    if: ${{ inputs.bench == 'fix' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      cases: ${{ steps.plan.outputs.cases }}
      conditions: ${{ steps.plan.outputs.conditions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Fetch the private held-out set (ids only are read here)
        if: inputs.set == 'held-out'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: seanudeke/Nightshift-heldout
          token: ${{ secrets.HELDOUT_TOKEN }}
          path: heldout-set
          persist-credentials: false
      - name: Pick the cases and conditions
        id: plan
        env:
          CASES: ${{ inputs.cases }}
          CONDITIONS: ${{ inputs.conditions }}
          SET: ${{ inputs.set }}
          EXPECTRAIL_HELDOUT_DIR: ${{ github.workspace }}/heldout-set
        run: |
          python - <<'PY'
          import json, os
          from agents.matrix import CONDITIONS, REPORTED_CONDITION, dev_variants, heldout_cases
          from agents.reported_trial import case_ids
          which = os.environ["SET"]
          every = (sorted(dev_variants()) if which == "dev" else case_ids() if which == "reported"
                   else sorted(heldout_cases()))
          cases = [c.strip() for c in os.environ["CASES"].split(",") if c.strip()] or every
          from expectrail.legacy import current_name
          allowed = [REPORTED_CONDITION] if which == "reported" else list(CONDITIONS)
          conds = ([REPORTED_CONDITION] if which == "reported" else
                   [current_name(c.strip()) for c in os.environ["CONDITIONS"].split(",") if c.strip()] or list(CONDITIONS))
          bad = sorted(set(cases) - set(every)) + sorted(set(conds) - set(allowed))
          if bad:
              raise SystemExit(f"unknown case or condition: {bad}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"cases={json.dumps(cases)}\nconditions={json.dumps(conds)}\n")
          print(cases, conds)
          PY

  run:
    needs: [plan, sam-warm]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: ${{ fromJSON(needs.plan.outputs.cases) }}
        condition: ${{ fromJSON(needs.plan.outputs.conditions) }}
    env:
      LIVE: ${{ inputs.live }}
      KEYS_OK: ${{ secrets.META_API_KEY != '' && secrets.MODEL_API_KEY != '' }}
      HELDOUT_TOKEN_SET: ${{ secrets.HELDOUT_TOKEN != '' }}
    steps:
      - name: Require both keys for a live run
        if: env.LIVE == 'true' && env.KEYS_OK != 'true'
        run: |
          echo "::error::Set META_API_KEY (Muse) and MODEL_API_KEY (SAM, a different key) first."
          exit 1
      - name: Require the held-out token
        if: env.HELDOUT_TOKEN_SET != 'true'
        run: |
          echo "::error::Set HELDOUT_TOKEN so the verifier can mount the private held-out routes."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install bubblewrap, xvfb, software OpenGL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap xvfb libgl1-mesa-dri libglx-mesa0 patch
      - name: Allow unprivileged user namespaces for bubblewrap
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
          if [ -f /proc/sys/kernel/unprivileged_userns_clone ]; then
            echo 1 | sudo tee /proc/sys/kernel/unprivileged_userns_clone
          fi
          bwrap --die-with-parent --unshare-pid --dev /dev --tmpfs /tmp \
            --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib \
            --ro-bind /lib64 /lib64 -- true
      - name: Download Godot 4.7.2 and check its SHA-512
        run: ./harness/get_godot.sh
      - name: Fetch the private held-out set (verifier side only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: seanudeke/Nightshift-heldout
          token: ${{ secrets.HELDOUT_TOKEN }}
          path: heldout-set
          persist-credentials: false
      - name: Fetch this run's shared SAM answers
        if: inputs.sam_cache != 'off' && (inputs.live || inputs.bench == 'demo')
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sam-cache
          path: sam-cache
      - name: Restore them into the verifier's SAM cache (outside the fixer's sandbox)
        if: inputs.sam_cache != 'off' && (inputs.live || inputs.bench == 'demo')
        continue-on-error: true
        env:
          SAM_CACHE_KEY: ${{ secrets.HELDOUT_TOKEN }}
        run: |
          set -o pipefail
          if [ ! -f sam-cache/sam-cache.enc ]; then
            echo "::notice title=SAM shared cache::none for this run, so this job judges every frame itself"
            exit 0
          fi
          dest="$(python -c 'from agents.sam_observations import default_cache_dir; print(default_cache_dir() or "")')"
          [ -n "$dest" ] || { echo "::notice title=SAM shared cache::the SAM cache is off in this job"; exit 0; }
          mkdir -p "$dest"
          if openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:SAM_CACHE_KEY -in sam-cache/sam-cache.enc \
              | tar -C "$dest" -xzf - --no-same-owner; then
            echo "::notice title=SAM shared cache::$(python -m agents.sam_warm --count "$dest") answers restored; runner $ImageOS $ImageVersion"
          else
            rm -rf "$dest"
            echo "::warning title=SAM shared cache::could not be restored, so this job judges every frame itself"
          fi
          rm -rf sam-cache
      - name: Install Muse Code CLI
        if: env.LIVE == 'true'
        run: |
          curl -fsSL https://dev.meta.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install mitmproxy 12.2.3 for the Muse key gateway (its own environment)
        if: env.LIVE == 'true'
        run: |
          python -m venv "$RUNNER_TEMP/mitm"
          "$RUNNER_TEMP/mitm/bin/python" -m pip install --quiet --disable-pip-version-check "mitmproxy==12.2.3"
      - name: Run the case
        env:
          # Muse Code gets a placeholder key; the gateway holds the real one (agents/gateway.py).
          EXPECTRAIL_MUSE_GATEWAY: 'on'
          EXPECTRAIL_MITMDUMP: ${{ runner.temp }}/mitm/bin/mitmdump
          META_API_KEY: ${{ inputs.live && secrets.META_API_KEY || '' }}
          MODEL_API_KEY: ${{ inputs.live && inputs.set != 'reported' && secrets.MODEL_API_KEY || '' }}
          EXPECTRAIL_OBS_PROVIDER: ${{ inputs.live && inputs.set != 'reported' && 'sam' || 'trace' }}
          EXPECTRAIL_HELDOUT_DIR: ${{ github.workspace }}/heldout-set
          CASE: ${{ matrix.case }}
          CONDITION: ${{ matrix.condition }}
          SET: ${{ inputs.set }}
        run: |
          args=(--case "$CASE" --condition "$CONDITION" --out runs/matrix)
          if [[ "$LIVE" == "true" ]]; then args+=(--live --require-sandbox); fi
          set +e
          python -m agents.matrix "${args[@]}" > matrix.log 2>&1
          code=$?
          set -e
          if [[ "$SET" != "held-out" ]]; then tail -n 1 matrix.log; fi
          dir="runs/matrix/${CASE//\//_}/$CONDITION"
          python - "$dir/result.json" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          tries = "; ".join(f"{a['attempt']}: {a.get('decision')}" for a in r["attempts"])
          print(f"::notice title=Fix matrix {r['case']} {r['condition']}::detected {r.get('detected')}; "
                f"outcome {r['outcome']}; attempts {r['attemptsUsed']} ({tries}); {r['wallClockSeconds']} s; live={r['live']}"
                + (f"; SAM images {r['samImages']}" if r.get("samImages") is not None else ""))
          if r.get("detail") and not r.get("private"):  # public cases only: why it errored or was not detected
              print(f"::warning title=Fix matrix {r['case']} {r['condition']} detail::{' '.join(r['detail'].split())[:300]}")
          PY
          if [[ "$SET" == "reported" ]]; then
            # Each candidate's three judgments: Expectrail, the public check, Muse from screenshots.
            python -m agents.reported_trial --annotate "$dir/result.json"
          fi
          if [[ "$SET" != "held-out" ]]; then
            # Public cases only: what Muse did on each attempt, so an empty attempt has a visible cause.
            for d in "$dir"/attempt-*; do
              [[ -d "$d" ]] || continue
              python - "$d" <<'PY'
          import json, re, sys
          from pathlib import Path
          d = Path(sys.argv[1])
          meta = json.loads((d / "candidate.json").read_text()) if (d / "candidate.json").is_file() else {}
          box = json.loads((d / "sandbox.json").read_text()) if (d / "sandbox.json").is_file() else {}
          log = (d / "muse.log").read_text(errors="replace") if (d / "muse.log").is_file() else ""
          log = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", log)
          tail = " | ".join(line.strip() for line in log.strip().splitlines()[-8:] if line.strip())[-700:]
          print(f"::notice title=Muse {d.name}::source {meta.get('source')}; empty {meta.get('empty')}; "
                f"exit {meta.get('museExit')}; sandbox {box.get('kind')}; log: {tail or '(empty)'}")
          PY
            done
          fi
          exit "$code"
      - name: Muse key gateway evidence
        if: always() && env.LIVE == 'true'
        run: python -m agents.gateway --evidence runs/matrix
      - name: Keep the result, the candidates, the prompts and Muse's logs (no frames, no held-out material)
        if: always()
        env:
          SET: ${{ inputs.set }}
        run: |
          mkdir -p keep
          if [[ "$SET" == "held-out" ]]; then
            # Private cases: the sanitized result only.
            find runs/matrix -name result.json -print | while read -r f; do mkdir -p "keep/$(dirname "$f")"; cp "$f" "keep/$f"; done
            exit 0
          fi
          # result-private.json (a reported trial's guard reasons) is never kept.
          find runs/matrix -path '*held-out*' -prune -o -type f \( -name result.json -o -name candidate.patch \
            -o -name muse-prompt.txt -o -name muse.log -o -name candidate.json -o -name detection.json \
            -o -name judge.json \) -print \
            | while read -r f; do mkdir -p "keep/$(dirname "$f")"; cp "$f" "keep/$f"; done
      - name: Export scan before upload (nothing private, no keys, no signing key)
        id: export-scan
        if: always()
        run: python -m agents.export_scan keep --private heldout-set
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.export-scan.outcome == 'success'
        with:
          name: matrix-${{ strategy.job-index }}
          path: keep/
          retention-days: 14

  summary:
    needs: run
    if: ${{ always() && inputs.bench == 'fix' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: matrix-*
          merge-multiple: true
          path: results
      - name: Summarize
        run: |
          python -m agents.matrix --summarize results/runs/matrix | tee -a "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json
          doc = json.load(open("results/runs/matrix/matrix-summary.json"))
          for c, s in doc["conditions"].items():
              print(f"::notice title=Fix matrix {c}::fixed {s['fixed']} of {s['cases']}; not fixed {s['notFixed']}; "
                    f"not detected {s['notDetected']}; needs review {s['needsReview']}; errors {s['errors']}; "
                    f"{s['attempts']} attempts; live={s['live']}")
          PY

  judge-plan:
    if: ${{ inputs.bench == 'judge' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      cases: ${{ steps.plan.outputs.cases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Pick the judge cases
        id: plan
        env:
          CASES: ${{ inputs.cases }}
        run: |
          python - <<'PY'
          import json, os
          from agents.judge_bench import cases
          every = sorted(cases())
          picked = [c.strip() for c in os.environ["CASES"].split(",") if c.strip()] or every
          bad = sorted(set(picked) - set(every))
          if bad:
              raise SystemExit(f"unknown judge case: {bad}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"cases={json.dumps(picked)}\n")
          print(picked)
          PY

  judge-run:
    needs: [judge-plan, sam-warm]
    if: ${{ !cancelled() && needs.judge-plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: ${{ fromJSON(needs.judge-plan.outputs.cases) }}
    env:
      LIVE: ${{ inputs.live }}
      KEYS_OK: ${{ secrets.META_API_KEY != '' && secrets.MODEL_API_KEY != '' }}
      HELDOUT_TOKEN_SET: ${{ secrets.HELDOUT_TOKEN != '' }}
    steps:
      - name: Require both keys
        if: env.KEYS_OK != 'true'
        run: |
          echo "::error::Set META_API_KEY (Muse) and MODEL_API_KEY (SAM, a different key) first."
          exit 1
      - name: Require the held-out token
        if: env.HELDOUT_TOKEN_SET != 'true'
        run: |
          echo "::error::Set HELDOUT_TOKEN so the verifier can mount the private held-out routes."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install bubblewrap, xvfb, software OpenGL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap xvfb libgl1-mesa-dri libglx-mesa0 patch
      - name: Allow unprivileged user namespaces for bubblewrap
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
          if [ -f /proc/sys/kernel/unprivileged_userns_clone ]; then
            echo 1 | sudo tee /proc/sys/kernel/unprivileged_userns_clone
          fi
      - name: Download Godot 4.7.2 and check its SHA-512
        run: ./harness/get_godot.sh
      - name: Fetch the private held-out set (verifier side only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: seanudeke/Nightshift-heldout
          token: ${{ secrets.HELDOUT_TOKEN }}
          path: heldout-set
          persist-credentials: false
      - name: Fetch this run's shared SAM answers
        if: inputs.sam_cache != 'off' && (inputs.live || inputs.bench == 'demo')
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sam-cache
          path: sam-cache
      - name: Restore them into the verifier's SAM cache (outside the fixer's sandbox)
        if: inputs.sam_cache != 'off' && (inputs.live || inputs.bench == 'demo')
        continue-on-error: true
        env:
          SAM_CACHE_KEY: ${{ secrets.HELDOUT_TOKEN }}
        run: |
          set -o pipefail
          if [ ! -f sam-cache/sam-cache.enc ]; then
            echo "::notice title=SAM shared cache::none for this run, so this job judges every frame itself"
            exit 0
          fi
          dest="$(python -c 'from agents.sam_observations import default_cache_dir; print(default_cache_dir() or "")')"
          [ -n "$dest" ] || { echo "::notice title=SAM shared cache::the SAM cache is off in this job"; exit 0; }
          mkdir -p "$dest"
          if openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:SAM_CACHE_KEY -in sam-cache/sam-cache.enc \
              | tar -C "$dest" -xzf - --no-same-owner; then
            echo "::notice title=SAM shared cache::$(python -m agents.sam_warm --count "$dest") answers restored; runner $ImageOS $ImageVersion"
          else
            rm -rf "$dest"
            echo "::warning title=SAM shared cache::could not be restored, so this job judges every frame itself"
          fi
          rm -rf sam-cache
      - name: Install Muse Code CLI
        if: env.LIVE == 'true'
        run: |
          curl -fsSL https://dev.meta.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install mitmproxy 12.2.3 for the Muse key gateway (its own environment)
        if: env.LIVE == 'true'
        run: |
          python -m venv "$RUNNER_TEMP/mitm"
          "$RUNNER_TEMP/mitm/bin/python" -m pip install --quiet --disable-pip-version-check "mitmproxy==12.2.3"
      - name: Judge the candidate
        env:
          # Muse Code gets a placeholder key; the gateway holds the real one (agents/gateway.py).
          EXPECTRAIL_MUSE_GATEWAY: 'on'
          EXPECTRAIL_MITMDUMP: ${{ runner.temp }}/mitm/bin/mitmdump
          META_API_KEY: ${{ inputs.live && secrets.META_API_KEY || '' }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          EXPECTRAIL_HELDOUT_DIR: ${{ github.workspace }}/heldout-set
          CASE: ${{ matrix.case }}
        run: |
          args=(--case "$CASE" --out runs/judge)
          # Live: all three judges. Offline: the SAM-off verifier only, a free plumbing check.
          if [[ "$LIVE" == "true" ]]; then args+=(--live); else args+=(--no-sam); fi
          set +e
          python -m agents.judge_bench "${args[@]}" > judge.log 2>&1
          code=$?
          set -e
          tail -n 1 judge.log
          python - "runs/judge/${CASE//\//_}/result.json" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          d = r.get("decisions") or {}
          print(f"::notice title=Judge {r['case']}::label {r['label']}; SAM on {d.get('expectrailSam')}; "
                f"SAM off {d.get('expectrailNoSam')}; Muse screenshots {d.get('museScreenshots')}; "
                f"{r['wallClockSeconds']} s; live={r['live']}"
                + (f"; SAM images {r['samImages']}" if r.get("samImages") is not None else ""))
          # Every judge case is built from public development variants, so its reasons can be shown.
          names = {"expectrailSam": "SAM on", "expectrailNoSam": "SAM off", "museScreenshots": "Muse screenshots"}
          why = [f"{names[k]}: " + " | ".join(" ".join(str(x).split())[:200] for x in (v or [])[:3])
                 for k, v in (r.get("reasons") or {}).items() if k in names and v]
          if why:
              print(f"::notice title=Judge reasons {r['case']}::" + " ;; ".join(why)[:900])
          if r.get("error"):
              print(f"::warning title=Judge {r['case']} error::{' '.join(r['error'].split())[:300]}")
          PY
          exit "$code"
      - name: Muse key gateway evidence
        if: always() && env.LIVE == 'true'
        run: python -m agents.gateway --evidence runs/judge
      - name: Keep the result, the candidate and the judge's log (no frames, no held-out material)
        if: always()
        run: |
          mkdir -p keep
          find runs/judge -path '*held-out*' -prune -o -type f \( -name result.json -o -name candidate.patch \
            -o -name muse-prompt.txt -o -name muse.log -o -name judge.json \) -print \
            | while read -r f; do mkdir -p "keep/$(dirname "$f")"; cp "$f" "keep/$f"; done
      - name: Export scan before upload (nothing private, no keys, no signing key)
        id: export-scan
        if: always()
        run: python -m agents.export_scan keep --private heldout-set
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.export-scan.outcome == 'success'
        with:
          name: judge-${{ strategy.job-index }}
          path: keep/
          retention-days: 14

  judge-summary:
    needs: judge-run
    if: ${{ always() && inputs.bench == 'judge' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: judge-*
          merge-multiple: true
          path: results
      - name: Summarize
        run: |
          python -m agents.judge_bench --summarize results/runs/judge | tee -a "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json
          doc = json.load(open("results/runs/judge/judge-summary.json"))
          for j, s in doc["judges"].items():
              print(f"::notice title=Judge summary {j}::good fixes accepted {s['goodAccepted']} of {s['good']}; "
                    f"bad fixes accepted {s['badAccepted']} of {s['bad']}; undecided {s['undecided']}")
          PY

  # The Gate 2 demo path, live: the overnight loop end to end (Wonder triage, Muse Code in bubblewrap,
  # the Godot harness, the verifier with SAM on and the private routes, the signed morning report and
  # the trust check), N times. Each run is its own job and process, so no run leaves state for the next.
  demo-plan:
    if: ${{ inputs.bench == 'demo' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runs: ${{ steps.plan.outputs.runs }}
    steps:
      - id: plan
        env:
          RUNS: ${{ inputs.runs }}
        run: |
          [[ "$RUNS" =~ ^[0-9]+$ && "$RUNS" -ge 1 && "$RUNS" -le 20 ]] || { echo "::error::runs must be 1 to 20"; exit 1; }
          echo "runs=$(python3 -c "import json,sys; print(json.dumps(list(range(1, int(sys.argv[1]) + 1))))" "$RUNS")" >> "$GITHUB_OUTPUT"

  demo-run:
    needs: [demo-plan, sam-warm]
    if: ${{ !cancelled() && needs.demo-plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        run: ${{ fromJSON(needs.demo-plan.outputs.runs) }}
    env:
      KEYS_OK: ${{ secrets.META_API_KEY != '' && secrets.MODEL_API_KEY != '' }}
      HELDOUT_TOKEN_SET: ${{ secrets.HELDOUT_TOKEN != '' }}
    steps:
      - name: Require both keys and the held-out token
        run: |
          [ "$KEYS_OK" = "true" ] || { echo "::error::Set META_API_KEY (Muse) and MODEL_API_KEY (SAM, a different key) first."; exit 1; }
          [ "$HELDOUT_TOKEN_SET" = "true" ] || { echo "::error::Set HELDOUT_TOKEN so the verifier can mount the private held-out routes."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install bubblewrap, xvfb, software OpenGL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap xvfb libgl1-mesa-dri libglx-mesa0 patch
      - name: Allow unprivileged user namespaces for bubblewrap
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
          if [ -f /proc/sys/kernel/unprivileged_userns_clone ]; then
            echo 1 | sudo tee /proc/sys/kernel/unprivileged_userns_clone
          fi
          bwrap --die-with-parent --unshare-pid --dev /dev --tmpfs /tmp \
            --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib \
            --ro-bind /lib64 /lib64 -- true
      - name: Download Godot 4.7.2 and check its SHA-512
        run: ./harness/get_godot.sh
      - name: Fetch the private held-out set (verifier side only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: seanudeke/Nightshift-heldout
          token: ${{ secrets.HELDOUT_TOKEN }}
          path: heldout-set
          persist-credentials: false
      - name: Fetch this run's shared SAM answers
        if: inputs.sam_cache != 'off' && inputs.judge_drill != 'sam-unavailable' && (inputs.live || inputs.bench == 'demo')
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sam-cache
          path: sam-cache
      - name: Restore them into the verifier's SAM cache (outside the fixer's sandbox)
        if: inputs.sam_cache != 'off' && inputs.judge_drill != 'sam-unavailable' && (inputs.live || inputs.bench == 'demo')
        continue-on-error: true
        env:
          SAM_CACHE_KEY: ${{ secrets.HELDOUT_TOKEN }}
        run: |
          set -o pipefail
          if [ ! -f sam-cache/sam-cache.enc ]; then
            echo "::notice title=SAM shared cache::none for this run, so this job judges every frame itself"
            exit 0
          fi
          dest="$(python -c 'from agents.sam_observations import default_cache_dir; print(default_cache_dir() or "")')"
          [ -n "$dest" ] || { echo "::notice title=SAM shared cache::the SAM cache is off in this job"; exit 0; }
          mkdir -p "$dest"
          if openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:SAM_CACHE_KEY -in sam-cache/sam-cache.enc \
              | tar -C "$dest" -xzf - --no-same-owner; then
            echo "::notice title=SAM shared cache::$(python -m agents.sam_warm --count "$dest") answers restored; runner $ImageOS $ImageVersion"
          else
            rm -rf "$dest"
            echo "::warning title=SAM shared cache::could not be restored, so this job judges every frame itself"
          fi
          rm -rf sam-cache
      - name: Install Muse Code CLI
        run: |
          curl -fsSL https://dev.meta.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install mitmproxy 12.2.3 for the Muse key gateway (its own environment)
        run: |
          python -m venv "$RUNNER_TEMP/mitm"
          "$RUNNER_TEMP/mitm/bin/python" -m pip install --quiet --disable-pip-version-check "mitmproxy==12.2.3"
      - name: One live overnight run
        env:
          # Muse Code gets a placeholder key; the gateway holds the real one (agents/gateway.py).
          EXPECTRAIL_MUSE_GATEWAY: 'on'
          EXPECTRAIL_MITMDUMP: ${{ runner.temp }}/mitm/bin/mitmdump
          META_API_KEY: ${{ secrets.META_API_KEY }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          EXPECTRAIL_OBS_PROVIDER: sam
          EXPECTRAIL_HELDOUT_DIR: ${{ github.workspace }}/heldout-set
          EXPECTRAIL_REVIEW: ${{ inputs.review }}
          # The judge ladder's fallback (agents/judge_ladder.py, docs/fallbacks.md): only when SAM does not
          # answer, the same candidate is judged by Glimmer checked against the engine. Never reaches Muse
          # Code (agents.keys.muse_subprocess_env is an allowlist). Without them that step is skipped.
          EXPECTRAIL_GLIMMER_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          EXPECTRAIL_GLIMMER_MODEL: ${{ vars.GLIMMER_MODEL }}
          EXPECTRAIL_JUDGE_DRILL: ${{ inputs.judge_drill == 'sam-unavailable' && 'sam-unavailable' || '' }}
          RUN: ${{ matrix.run }}
        run: |
          if [ -n "$EXPECTRAIL_JUDGE_DRILL" ]; then
            echo "::warning title=Judge drill::SAM is made unavailable on purpose in this run ($EXPECTRAIL_JUDGE_DRILL); its result is a drill, not a demo result"
          fi
          python -m agents.demo_loop --run "$RUN" --out runs/demo
      - name: Muse key gateway evidence
        if: always()
        run: python -m agents.gateway --evidence runs/demo
      - name: Keep the run's summary, morning report, verification and review (no held-out material)
        if: always()
        run: |
          mkdir -p keep
          find runs/demo -path '*held-out*' -prune -o -type f \( -name summary.json -o -name result.json \
            -o -name morning-report.md -o -name verification.json -o -name candidate.patch -o -name candidate.json \
            -o -name triage.json -o -name trust.json -o -name loop-error.txt \
            -o -name change-evidence.json -o -name review.html -o -name review-error.txt \
            -o -path '*/review/assets/*.png' \) -print \
            | while read -r f; do mkdir -p "keep/$(dirname "$f")"; cp "$f" "keep/$f"; done
      - name: Export scan before upload (nothing private, no keys, no signing key)
        id: export-scan
        if: always()
        run: python -m agents.export_scan keep --private heldout-set
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.export-scan.outcome == 'success'
        with:
          name: demo-run-${{ matrix.run }}
          path: keep/
          retention-days: 14

  demo-summary:
    needs: demo-run
    if: ${{ always() && inputs.bench == 'demo' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: demo-run-*
          path: results
      - name: How many runs were accepted
        env:
          RUNS: ${{ inputs.runs }}
        run: python -m agents.demo_loop --summarize results --expected "$RUNS" | tee -a "$GITHUB_STEP_SUMMARY"
